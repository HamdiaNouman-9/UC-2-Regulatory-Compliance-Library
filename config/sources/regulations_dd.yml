# Regulations DD — Truth in Savings (Federal Reserve Board, United States)
#
# ONE INSTRUMENT, DECLARED RATHER THAN CRAWLED
# --------------------------------------------
# The whole source is a single PDF on federalreserve.gov. There is no index
# worth walking to reach it, so it is named here and fingerprinted at run time
# rather than rediscovered by a browser on every crawl — the kdipa.yml pattern,
# and `DeclaredDocumentsSource` exists for exactly this shape.
#
# ---------------------------------------------------------------------------
# WHAT THE FILE ACTUALLY IS — read before trusting the name
# ---------------------------------------------------------------------------
# VERIFIED 2026-09-28 by downloading and reading it: 306,814 bytes, 46 pages,
# PDF metadata `author: Federal Reserve Board`, `title: Reg DD Background,
# Procedures, and Checklist`. Page 1 opens:
#
#     Regulation DD
#     Truth in Savings
#     Background
#     Regulation DD (12 CFR 230), which implements the Truth in Savings Act
#     (TISA), became effective in June 1993...
#
# and the last page is headed "Regulation DD - Truth in Savings / Examination
# Checklist". So the file runs background → section-by-section definitions
# (§ 230.2 onward) → examination procedures → a yes/no/NA checklist.
#
# IT IS NOT THE REGULATION ITSELF. 12 CFR 230 is the instrument; this is the
# Federal Reserve's EXAMINATION MATERIAL about it. Its parent is Consumer
# Affairs Letter CA 09-14, 16 December 2009, "Updated Examination Procedures for
# Regulation DD" (.../0914/caltr0914.htm, confirmed 200), whose text reads: "The
# Task Force on Consumer Compliance of the Federal Financial Institutions
# Examination Council recently approved the attached updated examination
# procedures." Worth knowing for two reasons — a reader expecting the
# regulation's own text will not find it here, and if the library later wants
# 12 CFR 230 that is a DIFFERENT url and a different entry.
#
# ---------------------------------------------------------------------------
# THE NAME IS SETTLED. DO NOT "CORRECT" IT.
# ---------------------------------------------------------------------------
# `regulator` below is "Regulations DD", PLURAL, exactly as handed over, and
# CONFIRMED PLURAL BY THE LEAD ON 2026-09-28 when asked directly. It is used
# verbatim on the kdipa.yml precedent: the library's chosen key for a source is
# the library's to choose, and a near-miss is not an error, it is a wrong answer
# — `regulator` becomes doc_path[0], which is an identity field, so changing it
# after rows are stored re-identifies every one of them.
#
# THE DOCUMENT ITSELF SAYS "Regulation DD", SINGULAR, in its own heading, in its
# PDF metadata and in the CA letter's subject line. That mismatch is recorded
# here precisely so nobody rediscovers it and helpfully fixes it: the plural is
# the library's key, the singular is the instrument's own name, and they are
# allowed to differ. It was raised and answered before anything was promoted.
#
# The string is repeated in five places and they must stay byte-identical —
# verified 2026-09-28 across all of them:
#     config/sources/regulations_dd.yml   regulator, and both keys below
#     config/countries.yml                under "United States of America"
#     config/change_signals.yml           regulator + source_system
#     jobs/monitor_jobs.py                _monitor_regulations_dd_impl
#     the stored rows                     regulator, source_system, doc_path[0]
# A near miss does not error anywhere: country_for() returns None and the folder
# silently goes to the tree root, and settings_for() falls back to defaults.
#
# ---------------------------------------------------------------------------
# THE FINGERPRINT — tier 2, and measured
# ---------------------------------------------------------------------------
# MEASURED 2026-09-28 against www.federalreserve.gov. The server offers BOTH:
#
#     ETag           "ed8226e119aca1:0"
#     Last-Modified  Wed, 20 Jan 2010 20:44:58 GMT
#
# and both came back IDENTICAL on a second call two seconds later — which is the
# test that matters, because CMA's Last-Modified is the current time and
# reported 1,134 false changes. `stamp_declared` hashes on that stamp, which is
# ONBOARDING's second-preference basis (a publisher's own change stamp), so the
# day the Board replaces the file at this url the row reports `modified`.
# `extra_meta.hash_basis` records which basis each run used, so a silent
# downgrade to the weak `url|title` fallback is visible rather than assumed.
#
# A LAST-MODIFIED OF JANUARY 2010 IS NOT A STALE CRAWL — it is a 2009 letter's
# attachment that has not been reissued in fifteen years. Do not read a future
# `unchanged` as the monitoring having failed.
#
# NOTE FOR WHOEVER ADDS MORE FEDERAL RESERVE SOURCES: this host sits behind
# Cloudflare (`server: cloudflare`), and config/sources/ffiec.yml records what
# that costs a crawling source on a US federal site — `strategy: generic` there
# is the difference between 8 documents and none. It costs this source nothing,
# because a declared source makes one plain request for one file and never opens
# a browser. That is a second reason to declare a lone PDF rather than crawl to it.

regulator: "Regulations DD"
owner: lead

sources:
  - name: "Regulations"
    mode: declared
    regulator: "Regulations DD"
    # SAME STRING AS `regulator`, deliberately, as kdipa.yml does. doc_path is
    # [regulator, source_system, ...folders, title] and `_clean_trail` drops a
    # crumb that repeats one already in the trail, so this collapses to
    #     Regulations DD | <title>
    # rather than saying the same word twice. A second source here later gets
    # its own source_system, which is what scopes `disappeared`.
    source_system: "Regulations DD"
    # <title> :: <url> — two parts, so no section crumb and no folder that only
    # repeats its parent.
    #
    # THE TITLE IS THE DOCUMENT'S OWN, drawn from the three places the file
    # names itself: its page-1 heading ("Regulation DD / Truth in Savings /
    # Background"), its closing header ("Regulation DD - Truth in Savings /
    # Examination Checklist") and its PDF metadata ("Reg DD Background,
    # Procedures, and Checklist"). It is what a reviewer reads in the
    # `status = ''` queue when deciding whether the library holds the instrument
    # they wanted, so it says what the 46 pages contain rather than abbreviating.
    documents:
      - "Regulation DD — Truth in Savings: Background, Examination Procedures, and Checklist :: https://www.federalreserve.gov/boarddocs/caletters/2009/0914/09-14-attachment.pdf"
