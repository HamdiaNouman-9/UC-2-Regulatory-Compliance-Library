  # which A-1 failed to fetch would propose the Privacy Act for withdrawal. Same
  # reasoning as "ONE ENTRY PER ACT" above; it is spelled out again because this
  # is the first case where the CLIENT LIST invites the mistake rather than the
  # site.
  #
  # Their `lims:fid` values are unrelated — A-1 is 167, P-21 is 397163 — which
  # is the publisher agreeing they are two documents.
  # ---------------------------------------------------------------------------

  - name: "Access to Information Act"
