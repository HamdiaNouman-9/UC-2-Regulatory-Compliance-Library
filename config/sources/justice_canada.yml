  #
  #     14,082,767 bytes of XML  ->  7,428,948 characters of text
  #
  # That is 227x the 32,767-character Excel cell limit, and TEN TIMES the four
  # Acts onboarded before it put together (~695,000 characters in total). It
  # alone takes the `.fulltext.json` sidecar from 1.3 MB to roughly 20 MB,
  # because an overflowing document is parked in the sidecar TWICE — once as its
  # content column and once inside its extra_meta blob.
  #
  # MEASURED, NOT ASSUMED, BEFORE THIS ENTRY WAS WRITTEN: run through
  # JusticeCanadaActCrawler unmodified on 2026-09-17 it took 18.1 seconds, peaked
  # at 324 MB, returned one document with zero warnings and hashed to 37ab60df… .
  # Nothing in the crawler, the sidecar or the cell-overflow path needed changing
  # to carry it.
  #
  # STILL ONE ROW. Size does not change the publisher's unit: this is one Act,
  # with one `lims:fid` (279718), one currency banner and one point-in-time
  # index. Splitting it by Part would invent documents the publisher does not
  # have — the same mistake as a row per `page-N.html`.
  # ---------------------------------------------------------------------------

