  # ---------------------------------------------------------------------------
  # ADDED 2026-09-22 — a TENTH entry, and again NO CRAWLER CHANGE. Run through
  # JusticeCanadaActCrawler unmodified before this entry was written: 3.6s, one
  # document, 298,396 characters, ZERO warnings, hash 5997c944… . Every
  # assumption the crawler makes held — <h1 class='HeadTitle'> present, the page
  # advertises the /eng/XML/<CODE>.xml the pattern predicts, the XML has a
  # <Statute> root, and the XML fetched twice was byte-identical.
  #
  # THE BRIEF CALLS THIS "Proceeds of Crime, Money Laundering and Terroristm".
  # The publisher's own <h1> reads "Proceeds of Crime (Money Laundering) and
  # Terrorist Financing Act (S.C. 2000, c. 17)" — note the parentheses, which
  # are part of the short title, and "Terrorist Financing" rather than
  # "Terrorism". The PAGE's name is used, agreed 2026-09-22, the same call made
  # for "Insurance Act" -> "Insurance Companies Act" above and for NBR's
  # regulator name. The url the brief supplied is right and its label is loose.
  #
  # THE BRIEF ALSO GIVES THE laws.justice.gc.ca HOSTNAME. That host and
  # laws-lois.justice.gc.ca serve BYTE-IDENTICAL pages (both 31,376 bytes,
  # measured 2026-09-22). laws-lois is used here because `fetch_documents`
  # compares the page's advertised XML href against `xml_url` as BASE + href,
  # and BASE is laws-lois — configuring the other hostname would make the
  # crawler raise "page advertises X but this source is configured for Y" on
  # every run, which is the guard working correctly against a url we chose.
  #
  # THE DATE TRAP REPRODUCED A TENTH TIME:
  #
  #     act        page says       its XML says   its XML file written
  #     P-24.501   2026-07-21      2026-03-31     2026-05-22 18:04:20
  #
  # The banner claims July over a file not rewritten since MAY and a
  # consolidation cut in MARCH. Handled by `_strip_volatile`; recorded because
  # a measurement that was predicted and then held is the evidence for the rule.
  #
  # AND THE PDF BATCH STAMP AN ELEVENTH TIME. P-24.501.pdf carries
  # Last-Modified 2026-08-31 18:00:14 — the SAME site-wide timestamp as the ten
  # other Acts in config/change_signals.yml. Its XML carries 2026-05-22 and an
  # ETag of "0ea876915eadc1:0" that was stable across repeated probes. The probe
  # target stays the XML.
  #
  # ONE FURTHER OBSERVATION, recorded so nobody builds on it: two HEAD requests
  # seconds apart returned Content-Length 674199 and then 96499 for the SAME
  # file, because IIS answers a HEAD with or without gzip depending on
  # negotiation. ETag and Last-Modified were identical across both and the GET
  # was byte-identical, so nothing is wrong — but CONTENT-LENGTH ALONE IS NOT A
  # VERSION TOKEN ON THIS HOST. `dynamic_crawler/fingerprint.py` takes the ETag
  # here and never reaches the length, so this is a trap that is already avoided
  # rather than one to fix.
  # ---------------------------------------------------------------------------

  - name: "Proceeds of Crime (Money Laundering) and Terrorist Financing Act"
    mode: custom
    crawler_class: "crawler.justice_canada_crawler.JusticeCanadaActCrawler"
