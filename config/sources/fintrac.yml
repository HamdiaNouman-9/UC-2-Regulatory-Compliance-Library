  # GUIDELINES — the brief's tab is the "Obligations and guidance" hub. One row
  # per guidance page, one flat folder: a page moved between hub sections must
  # not read as new + disappeared. The hub section is kept in extra_meta.
  # 62 of the 67 pages embed a hidden 57,659-char glossary, and every page has a
  # hand-kept Date Modified that lags edits; both are stripped before hashing.
  # Date Modified is an update date, so published_date is empty (2026-10-12).
  # No guidance page offers a PDF of itself (measured 2026-10-12): the page is the
  # document. Links go in extra_meta.content_links; the two off-site files (a
  # Canada Gazette PDF, Public Safety's listed-entities XML) are references there.
  # Images (flowcharts, infographics) are recorded in extra_meta.image_urls:
  # about half have no text description, so their content is not in the text.
  - name: "Guidelines"
    mode: custom
    crawler_class: "crawler.fintrac_crawler.FintracCrawler"
    init_kwargs:
      regulator: "Financial Transactions and Reports Analysis Centre of Canada (FINTRAC)"
      source_system: "Guidelines"
      tab: guidelines
      hub_url: "https://fintrac-canafe.canada.ca/guidance-directives/guidance-directives-eng"
      # The brief's tab = these hub sections. A section that disappears stops the crawl.
      sections:
        - "Implementing a compliance program"
        - "Knowing your client"
        - "Transaction reporting"
        - "Record keeping"
        - "Other requirements"
        - "Ministerial directives"
        - "Private-to-private information sharing (voluntary)"
      # An index of three links, not guidance.
      skip_urls: ["/obligations/directives-eng"]
      # Floors, not counts: 67 documents, smallest 1,125 chars, measured 2026-09-29.
      min_documents: 60
      min_text_chars: 1000
