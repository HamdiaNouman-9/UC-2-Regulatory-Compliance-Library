# FINTRAC — tabs "Regulations" and "Guidelines", one controller (FintracCrawler);
# each entry names its `tab`. Measured 2026-09-29, see UC-2-Scratch/FINTRAC/.
#
# REGULATIONS
#
# FINTRAC's page /act-loi/1-eng holds no regulation text: it links six
# regulations on laws-lois.justice.gc.ca, the only place their text is
# published. One row per regulation, filed under FINTRAC. FINTRAC's own list is
# the scope; it omits SOR/2021-181 and SOR/2025-67, listed under the Act there.
#
# Since 2026-10-12 each is read by JusticeCanadaActCrawler, the JUS treatment
# (same site, same template): document_url = the PDF, document_html and the hash
# = FullText.html without its banner header, published_date empty (the last-
# amended date is an update date, kept in extra_meta), no XML in the workbook.
# The XML is only the monitoring probe (JusticeXmlSweep, from reference_no).
# The page banner "Regulations are current to <date>" is the same on every
# regulation and never enters the hash.

regulator: "Financial Transactions and Reports Analysis Centre of Canada (FINTRAC)"
owner: Fakih

sources:
  - name: "Proceeds of Crime (Money Laundering) and Terrorist Financing Regulations"
    mode: custom
    crawler_class: "crawler.fintrac_crawler.FintracCrawler"
    init_kwargs:
      tab: regulations
      regulator: "Financial Transactions and Reports Analysis Centre of Canada (FINTRAC)"
      source_system: "Regulations"
      reg_code: "SOR-2002-184"
      reg_folder: "Proceeds of Crime (Money Laundering) and Terrorist Financing Regulations"
      # The page's own <h1>, recorded 2026-09-29.
      expected_title: "Proceeds of Crime (Money Laundering) and Terrorist Financing Regulations (SOR/2002-184)"
      # A floor, not the count: 330,134 chars measured 2026-09-29.
      min_text_chars: 100000

