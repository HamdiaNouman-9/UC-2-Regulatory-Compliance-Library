# 2026-09-21: cbb_others.yml was merged back into this file. Every source below is
# active.
# CBB — Central Bank of Bahrain
#
# Migrated onto the source-config flow 2026-08-20. Before that CBB was the only
# regulator built entirely outside it: ~1,500 lines across crawler/cbb_crawler.py,
# crawler/cbb_monitoring_crawler.py, cbb_browser.py, cbb_test_crawlers/ and
# site_runners/cbb_updates.py, plus its own `_process_cbb_doc` branch in the
# orchestrator, its own API endpoint and the only `enabled: true` monitoring job.
#
# ---------------------------------------------------------------------------
# 1. WHY THE MIGRATION WAS FREE
# ---------------------------------------------------------------------------
# MEASURED 2026-08-20 against this database:
#
#   regulations WHERE regulator LIKE '%Bahrain%'   ->  0 rows
#   source_system LIKE 'CBB%'                      ->  0 rows
#   run_history for CBB                            ->  0 rows
#
# The scheduled `cbb_monitoring` job has never landed a document here. (The
# project deck reports "CBB, 9 documents analysed" -- that was a different
# database, or before a reset.) So there was no identity to protect, no version
# history to carry and no rename to pay for. That will not be true again once
# this config has run, so the naming below is settled NOW rather than later.
#
# ---------------------------------------------------------------------------
# 2. MODE 1 WAS WRITING UNDER MODE 5's NAME
# ---------------------------------------------------------------------------
# `_scrape_resolution` (crawler/cbb_crawler.py:196) stamps
# `source_system = "CBB-Compliance"` on Thomson Reuters *Regulations and
# Resolutions* -- the same value mode 5's Compliance pages use. It reads as a
# copy-paste, and it is fatal here: the completeness gate and `disappeared` are
# scoped on (regulator, source_system), so two sources sharing one name means
# each one's gate sees the other's stored rows and reports them missing. That is
# the failure change_signals.yml records MHRSD hitting.
#
# Corrected in crawler/cbb_source.py::SOURCE_SYSTEM_OVERRIDE rather than by
# editing cbb_crawler.py, so the old `cbb_monitoring` job keeps its exact
# behaviour while both paths coexist. See that file for how to revert it if this
# repo is ever pointed at a database that holds mode-1 rows under the old name.
#
# ---------------------------------------------------------------------------
# 3. WHY SEVEN SOURCES AND NOT ONE
# ---------------------------------------------------------------------------
# CBBCrawlerV2.fetch_documents(mode=None) runs all seven modes and returns one
# flat list. Left that way CBB would be a single source: one baseline, one gate,
# one change signal for the whole regulator, and a mode that silently returned
# nothing would be absorbed into a bigger number.
#
# ONBOARDING's rule is the opposite -- several small sources, each with its own
# baseline, so one section breaking is VISIBLE. cbe.yml is split the same way and
# it is what caught Governance returning 5 documents where 17 exist.
#
# ---------------------------------------------------------------------------
# 4. THE CHANGE SIGNAL IS A NATIVE REVISION FEED — SEE change_signals.yml
# ---------------------------------------------------------------------------
# CBB's rulebook is hosted on Thomson Reuters, which publishes
# https://cbben.thomsonreuters.com/view-revision-updates -- the regulator's own
# "what changed in this date range" page. That is the best class of signal in the
# repo: no probing, no inferring, no stale-stamp risk.
#
# SAMA runs on the SAME platform with the same endpoint
# (rulebook.sama.gov.sa/en/view-revision-updates, read by
# dynamic_crawler/sama_feed_signal.py). Two regulators, one pattern.
#
# It CANNOT see deletions -- a withdrawn document simply stops appearing -- so
# the sources below still need a periodic full crawl to notice absence. That is
# what the `crawl` signal is for; the feed makes it cheap to run rarely, not
# unnecessary.

regulator: "Central Bank of Bahrain"
owner: lead

sources:
  # ---- Thomson Reuters ----------------------------------------------------
  # Mode 1. Renamed from CBB-Compliance -- see section 2 above.
  - name: "Regulations and Resolutions"
    mode: custom
    crawler_class: "crawler.cbb_source.CBBSource"
    # ONE INSTRUMENT IN TWO LANGUAGES IS ONE ROW. MEASURED on the 2026-09-04
    # export of this source, 71 rows: three pairs are the same instrument
    # published twice.
    #
    #   Resolution No. (22) of 2021   same title, same doc_path, SAME
    #   Resolution No. (23) of 2021   content_hash; the urls differ only by an
    #                                 "_Arabic" suffix
    #   Resolution No. (34) of 2010   "(Arabic)" / "(English)" trails the title
    #                                 AND the last doc_path crumb
    #
    # They survived as six rows because document_url is a third of the default
    # identity. This folds each pair into the C19 multi-attachment shape --
    # document_url empty, both files in extra_meta.attachment_links, identity
    # declared as (doc_path, attachment_links, title). 71 rows -> 68.
    #
    # READ BY CompositeCrawler, NOT by the crawler class:  returns
    # at  before any wrapper key is read, so this key would be
    # invisible if the merge still lived on GenericSiteCrawler.
    #
    # IT DOES NOT TOUCH THE CONTAMINATED PAIRS. Five hashes are shared by ten
    # rows here while only three titles are, so two pairs are different
    # instruments carrying each other's text. Grouping on title means those never
    # fuse -- merging them would hide the fingerprint bug rather than fix it.
    merge_files_at_same_path: true
    init_kwargs:
      mode: "1"
      source_system: "CBB-Regulations-and-Resolutions"

  # ---- Mode 2c. The rulebook, ONE SOURCE PER VOLUME ----------------------
  #
  # SPLIT 2026-09-07, from a single "Rulebook" source writing "CBB-Rulebook".
  #
  # Section 3 above argues that CBB must be seven sources and not one, so that a
  # section returning nothing is VISIBLE rather than absorbed into a bigger
  # number. That argument was never carried one level down: mode 2c walks eight
  # volumes into a single flat list, so the whole rulebook shared one baseline
  # and one completeness gate. MEASURED on a 2026-09-07 run:
  #
  #   Common Volume   153 docs in ~6 minutes
  #   Volume 1        still running at 18 minutes
  #
  # Three costs, and the split answers all three:
  #
  #   1. NOTHING IS USABLE UNTIL THE LAST VOLUME LANDS. The run is the sum of
  #      eight walks, each thousands of sequential requests at 1.2s.
  #   2. ONE FAILURE COSTS EVERYTHING. A drop anywhere leaves the single
  #      baseline short, so the gate quarantines the run and seven good volumes
  #      go down with the eighth. Split, only the volume that actually came
  #      back short is quarantined; the rest keep their baselines.
  #   3. AN EMPTY VOLUME WAS INVISIBLE. `orch._docs_by_source` gives every
  #      declared source a row even when it produced nothing -- but only if it
  #      IS a source. Under one name, a volume returning zero just made the
  #      total smaller.
  #
  # `max_volumes` could not do this: it is `volumes[:n]`, a PREFIX, so there was
  # no way to say "Volume 5". `volume:` names one, matched case-insensitively on
  # the sidebar title; CBBSource raises unless the name matches exactly one.
  #
  # THE SOURCE_SYSTEMS MUST STAY DISTINCT. They are what scopes `disappeared`
  # and the gate, and what would make `only_sources` narrowing safe if it is
  # ever exposed on `export` -- narrowing is unsafe where the sources left out
  # share a source_system with the ones kept.
  #
  # RUNTIME IS UNCHANGED: all eight still run in one `export`. What changed is
  # that the eight are now measured, quarantined and reported separately.
  - name: "Rulebook — Common Volume"
    mode: custom
    crawler_class: "crawler.cbb_source.CBBSource"
    init_kwargs:
      mode: "2c"
      volume: "Common Volume"
      source_system: "CBB-Rulebook-Common"

  - name: "Rulebook — Volume 1 Conventional Banks"
    mode: custom
    crawler_class: "crawler.cbb_source.CBBSource"
    init_kwargs:
      mode: "2c"
      volume: "Volume 1"
      source_system: "CBB-Rulebook-Vol-1"

  - name: "Rulebook — Volume 2 Islamic Banks"
    mode: custom
    crawler_class: "crawler.cbb_source.CBBSource"
    init_kwargs:
      mode: "2c"
      volume: "Volume 2"
      source_system: "CBB-Rulebook-Vol-2"

  - name: "Rulebook — Volume 3 Insurance"
    mode: custom
    crawler_class: "crawler.cbb_source.CBBSource"
    init_kwargs:
      mode: "2c"
      volume: "Volume 3"
      source_system: "CBB-Rulebook-Vol-3"

  - name: "Rulebook — Volume 4 Investment Business"
    mode: custom
    crawler_class: "crawler.cbb_source.CBBSource"
    init_kwargs:
      mode: "2c"
      volume: "Volume 4"
      source_system: "CBB-Rulebook-Vol-4"

  - name: "Rulebook — Volume 5 Specialised Licensees"
    mode: custom
    crawler_class: "crawler.cbb_source.CBBSource"
    init_kwargs:
      mode: "2c"
      volume: "Volume 5"
      source_system: "CBB-Rulebook-Vol-5"

  - name: "Rulebook — Volume 6 Capital Markets"
    mode: custom
    crawler_class: "crawler.cbb_source.CBBSource"
    init_kwargs:
      mode: "2c"
      volume: "Volume 6"
      source_system: "CBB-Rulebook-Vol-6"

  # OVERLAPS THE CAPITAL MARKET SOURCE. Volume 7 is Collective Investment
  # Undertakings, and `cbb-capital-market-regulations` links the same volume --
  # where it is crawled through a stale endpoint that yields the superseded BDE
  # module (see the KNOWN GAP note in crawler/cbb_source.py). Whichever of the
  # two ends up owning this content, it must not be BOTH: two source_systems
  # holding one instrument means two identities and two review queues for it.
  # KEPT ALONGSIDE `CBB-Capital-Market-Regulations` ON PURPOSE (decided 2026-09-21: both
  # are on the website). Volume 7 is Collective Investment Undertakings, and the
  # capital-market source links the same volume through an older endpoint, so the same
  # instrument can be stored under BOTH source_systems -- two identities, two review
  # queues. Accepted; if it becomes a nuisance, narrow one of the two.
  - name: "Rulebook — Volume 7 Collective Investment Undertakings"
    mode: custom
    crawler_class: "crawler.cbb_source.CBBSource"
    init_kwargs:
      mode: "2c"
      volume: "Volume 7"
      source_system: "CBB-Rulebook-Vol-7"

  # # ---- cbb.gov.bh ---------------------------------------------------------
  # # Modes 2a and 2b share a crawler (Aml_crawler_v2) but write under different
  # # names, which is exactly why they are two sources rather than one.
  - name: "AML Law"
    mode: custom
    crawler_class: "crawler.cbb_source.CBBSource"
    init_kwargs:
      mode: "2a"
      source_system: "CBB-AML-LAW"

  - name: "Corporate Governance"
    mode: custom
    crawler_class: "crawler.cbb_source.CBBSource"
    init_kwargs:
      mode: "2b"
      source_system: "CBB-CORPGOV"

  - name: "Laws and Regulations"
    mode: custom
    crawler_class: "crawler.cbb_source.CBBSource"
    init_kwargs:
      mode: "3"
      source_system: "CBB-Laws-Regulations"

  - name: "Capital Market Regulations"
    mode: custom
    crawler_class: "crawler.cbb_source.CBBSource"
    init_kwargs:
      mode: "4"
      source_system: "CBB-Capital-Market-Regulations"

  - name: "Compliance"
    mode: custom
    crawler_class: "crawler.cbb_source.CBBSource"
    init_kwargs:
      mode: "5"
      source_system: "CBB-Compliance"
