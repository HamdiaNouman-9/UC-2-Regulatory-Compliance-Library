# CBJ — Central Bank of Jordan
#
# The yml form of:
#
#   python generic_crawler/crawler.py \
#     --url "https://www.cbj.gov.jo/EN/List/Memorandums_of_Understanding_MoUs" \
#     --out output/cbj_MOU --scope prefix --max-pages 1 --strategy generic
#
# `--out` has no key here on purpose: GenericSiteCrawler writes to a temp
# directory when `out_dir` is unset, so two runs cannot overwrite each other's
# artefacts. Set it only when you want the html/pages.json kept for debugging.
#
# ---------------------------------------------------------------------------
# THE SHAPE OF THIS FILE — "Legislation" IS THE PARENT, EACH LISTING A CHILD
# ---------------------------------------------------------------------------
# Every page below is one entry under the site's Legislation menu, and the
# library mirrors that: ONE "Legislation" folder holding one folder per listing,
# each holding its own documents.
#
#   Central Bank of Jordan (CBJ) | Legislation | Laws                         | <law>
#   Central Bank of Jordan (CBJ) | Legislation | Circulars                    | <circular>
#   Central Bank of Jordan (CBJ) | Legislation | Payment Systems Legislations | <doc>
#
# `_doc_path` (crawler/generic_crawler_wrapper.py) builds
# [regulator, source_system] (+ category, when `doc_path_category`) + the page's
# own breadcrumb crumbs, and the title last when `doc_path_title`. The site's
# crumbs arrive BELOW source_system, so the "Legislation" crumb can never become
# the parent by itself. Hence, on every source here:
#
#   source_system:      "Legislation"     the shared parent folder
#   category:           "<listing name>"  the child folder
#   doc_path_category:  true              without it `category` is a column the
#                                         folder tree never reads
#   doc_path_title:     true              the document is its own leaf
#
# This is the arrangement config/sources/rera.yml uses for its eight Regulations
# listings, and it is why `drop_sections` is now mostly redundant: `_clean_trail`
# already drops a crumb that repeats one earlier in the trail, so the
# "Legislation" and "Laws" crumbs on /EN/List/Laws fall out against source_system
# and category unaided. The key is load-bearing only where a crumb repeats
# NEITHER of those two — see the Payment Systems and Regulations sources.
#
# ONE COST, STATED PLAINLY. `disappeared` and the completeness gate are scoped on
# (regulator, source_system), so with all ten sources sharing "Legislation" they
# can no longer be gated apart: "the eight laws stood still while the MoUs grew"
# is a fact the gate can no longer state on its own. That is the trade this
# folder shape asks for, and it is the same one rera.yml already lives with. If a
# per-listing baseline is wanted later the fix is a per-source baseline key —
# splitting source_system again would flatten the tree straight back.
#
# ---------------------------------------------------------------------------
# THE GUID TITLES ARE FIXED. Kept as a record of what the site does.
# ---------------------------------------------------------------------------
# Every document first came back titled like "E2Ad73E3 0655 4B5C Aa4A
# Fa97B1919341". FOUR separate causes, each hiding the next, all fixed
# generically in generic_crawler/crawler.py on 2026-09-10:
#
#   1. every link carries title="2373" -- one CMS node id shared by all of
#      them. Four characters cleared `best_doc_title`'s length test, so the
#      row context below it never ran. `_BARE_NUMBER` now rejects a title
#      attribute made only of digits.
#   2. `disambiguate_titles` then correctly refused 34 identical titles and
#      re-derived each from the url slug -- and this site's slugs are guids.
#      That was a good repair on bad input, and is untouched.
#   3. `_merge_links` kept the FIRST sighting. Ten documents are linked twice,
#      from their titled row and from a "View & Download" button, and the
#      button often came first. A richer context now wins.
#   4. the other fourteen live only in a mobile CARD layout whose naming
#      element carries no row/card class, while the element above it holds all
#      24 documents. `JS_LINKS` gained a second pass that ignores class and
#      stops on substantive text before the container becomes a list.
#
# Plus one cosmetic pass: a card repeats the table's column headings, so the
# context read "File Name <name> Type Size 686KB". `_ctx_title` strips those.
#
# PROVEN NOT TO MOVE ANY OTHER REGULATOR: generic_crawler/regression_check.py
# unchanged, and a title diff over all 164 document links on its 13 frozen
# seed pages reported no title changed. Re-run both before touching that file.
#
# ---------------------------------------------------------------------------
# include_pages: never ON ALL TEN — MEASURED, NOT A PREFERENCE ABOUT INDEXES
# ---------------------------------------------------------------------------
# EVERY page on this site, /EN/List/ and /EN/Pages/ alike, reports page text of
# exactly 6,905 characters, and those characters are ENTIRELY SITE CHROME: a
# search of the extracted text on the Circulars page finds ZERO occurrences of
# "Circular", "Legislation", "Regulations" or "Home", and the same 6,905 comes
# back from the Constitution and AML pages, opening "Need a little help? To
# adjust this website for your accessibility needs...". What `JS_MAIN_CONTENT`
# reaches on cbj.gov.jo is never the content. 6,905 is comfortably over
# MIN_PAGE_TEXT (200), so `auto` or `always` promotes the accessibility widget as
# a document wearing the page's title — the difference between 56 documents and
# 57 rows where the 57th is a cookie banner.
#
# THAT WAS PROVEN THE EXPENSIVE WAY. Sources 9 and 10 ran `include_pages: always`
# for one export on the theory that an /EN/Pages/ page IS its instrument, and
# both produced exactly that chrome row. Their note records the measurement.
# Nothing on this site should carry `always` or `auto` again without re-measuring
# that number first.

regulator: "Central Bank of Jordan (CBJ)"
owner: lead

# Ordered as the site's Legislation menu lists them.
sources:

  # ---- 1. Payment Systems Legislations ------------------------------------
  # The largest CBJ source, and it was missed until 2026-09-14: the site's nav
  # lists five legislation pages and this config covered two.
  #
  # MEASURED 2026-09-14 by running the engine against the seed below:
  #   pages         1
  #   documents   140   all PDF
  #   breadcrumb  ['Home', 'Legislations', 'Payment Systems Legislations']
  #   page text   6,905 characters -- the site chrome described in the header
  #   titles      human-readable, e.g.
  #               "Automated Teller Machine Instructions No. (6/2018)"
  #               "Circular No. (26/1/7335) dated 21/4/2025 regarding the
  #                Settlement of ..."
  #
  # "Legislations" IS PLURAL HERE, AND THAT IS WHY drop_sections IS LOAD-BEARING
  # ON THIS SOURCE. Its siblings' crumb reads "Legislation", which `_clean_trail`
  # removes for free against source_system. This page's reads "Legislations", and
  # `_crumb_key` normalises punctuation and "&" but NOT plurals -- so without the
  # explicit drop this one source would file a level deeper than the other nine,
  # under a folder named "Legislations" sitting inside "Legislation".
  #
  # NO `merge_files_at_same_path`, DELIBERATELY. Several siblings need it -- Laws
  # has 2 instruments published as .pdf and .docx, Regulations and Instructions
  # at least 5, Circulars exactly 5. MEASURED here: 140 documents, 140 distinct
  # titles, ZERO duplicates, every file a PDF. There is no pair to fold. Setting
  # it anyway would be harmless today and wrong the day CBJ publishes two
  # genuinely different documents under one title, because it would fuse them.
  #
  # THE CATEGORY DROPDOWN IS REAL AND IS NOT USED. Every CBJ listing carries
  # `ddlCategory1` -- Banking Supervision Department, Money Exchange, Financial
  # Stability, and so on -- which looks like an area tree. MEASURED 2026-09-14 by
  # driving it in a browser: on Circulars and on Instructions_ EVERY category
  # returns zero rows, and only this page's two categories (Circulars,
  # Instructions) return any. The classification is unpopulated for the other
  # sources, not merely hard to reach.
  #
  # It is not needed here either: the filter and the pager are both DISPLAY ONLY.
  # The raw markup carries all 140 document links whatever category is selected
  # and whichever of the six pages is shown -- documents that appear only under
  # the "Instructions" filter are present in the unfiltered HTML. So
  # `max_pages: 1` sees everything, the same way it already does for Circulars'
  # 56 documents across six pages.
  - name: "Payment Systems Legislations"
    mode: generic
    seed_url: "https://www.cbj.gov.jo/EN/List/Payment_Systems_Legislations"
    scope: prefix
    strategy: generic
    source_system: "Legislation"
    category: "Payment Systems Legislations"
    doc_path_category: true
    doc_path_title: true
    drop_sections: ["Legislations"]
    include_pages: never
    max_pages: 1
    max_depth: 1

  # ---- 2. Memorandums of Understanding (MoUs) -----------------------------
  # MEASURED 2026-09-08 on the crawler command quoted at the top of this file:
  #   pages       1
  #   documents  24   all type PDF
  #   section    "Home > Legislation > Memorandums of Understanding (MoUs)"
  #   page text  6,905 characters, n_pdfs 24
  #
  # This is the page whose 24 guid titles produced the four crawler fixes
  # recorded in the header. It is the regression case for all of them.
  #
  # NO drop_sections NEEDED. Both substantive crumbs repeat something already in
  # the trail -- "Legislation" the source_system, the MoUs crumb the category --
  # so `_clean_trail` removes both, and "Home" goes as a CMS crumb.
  - name: "Memorandums of Understanding (MoUs)"
    mode: generic
    seed_url: "https://www.cbj.gov.jo/EN/List/Memorandums_of_Understanding_MoUs"
    scope: prefix
    strategy: generic
    source_system: "Legislation"
    category: "Memorandums of Understanding (MoUs)"
    doc_path_category: true
    doc_path_title: true
    include_pages: never
    # One page, and it holds every file. Depth beyond it would leave the listing
    # for the rest of cbj.gov.jo, which is a different source's job.
    max_pages: 1
    max_depth: 1

  # ---- 3. Circulars -------------------------------------------------------
  # Seeded on https://www.cbj.gov.jo/..., not the http://cbj.gov.jo/... form the
  # site's own nav uses: the host redirects to the canonical https+www origin,
  # and `scope: prefix` compares against the SEED's url, so seeding the
  # pre-redirect form risks every in-page link reading as out of scope.
  #
  # MEASURED 2026-09-14 by running the engine against the seed below:
  #   pages        1
  #   documents   56   (48 pdf, 5 docx, 3 doc)
  #   guid titles  0   -- every one already human-readable, e.g.
  #                "Circular to the Banks operating in the kingdom No. (22/2026)"
  #                "Circular No. 27/4430 dated 26th Feb. 2025 regarding Women Owned..."
  #   page text    6,905 characters
  #
  # `drop_sections` IS DEFENSIVE, NOT MEASURED. This page's breadcrumb came back
  # EMPTY, so the key is a no-op today. It is kept because the extractor
  # demonstrably finds the crumb on the sibling pages and missed it here, and the
  # two possible reasons -- the page really has none, or the extraction failed --
  # are indistinguishable from the output. A no-op costs nothing.
  - name: "Circulars"
    mode: generic
    seed_url: "https://www.cbj.gov.jo/EN/List/Circulars"
    scope: prefix
    strategy: generic
    source_system: "Legislation"
    category: "Circulars"
    doc_path_category: true
    doc_path_title: true
    drop_sections: ["Legislation"]
    include_pages: never
    # NEEDED, AND VERIFIED RATHER THAN ASSUMED. 5 titles appear twice, and all
    # five pairs are ONE instrument in TWO FORMATS -- each a .pdf beside a .docx
    # or .doc, two of them sharing a filename stem outright:
    #
    #   circular_no.10-1-10457_dated_1-7-2024.pdf / .docx
    #
    # That is the test the Laws source below asks for before this key is set:
    # same instrument twice wants the merge, different instruments sharing a
    # title want distinguishing titles instead. These are the former, so the 56
    # links become 51 rows with both files carried in extra_meta.attachment_links
    # and document_url left empty.
    merge_files_at_same_path: true
    max_pages: 1
    max_depth: 1

  # ---- 4. Instructions ----------------------------------------------------
  # A LANDING PAGE THAT HOLDS NOTHING. Do not confuse it with
  # /EN/List/Instructions_ (source 6 below, 106 documents) -- the trailing
  # underscore is the whole difference between the two urls, and the site links
  # this one onward to that one.
  #
  # MEASURED 2026-09-16 by running the engine against the seed below:
  #   pages        1
  #   documents    0
  #   breadcrumb  ['Home', 'Legislation', 'Instructions']
  #   page text   6,905 characters -- the site chrome, again
  #   the walk's only queued next url was .../EN/List/Instructions_
  #
  # ZERO IS THE MEASURED ANSWER, NOT A FAILED CRAWL: the page carries no document
  # links of its own. `max_depth: 0` stops the walk at the seed so this source
  # cannot follow through to Instructions_ and re-file all 106 of that source's
  # documents a second time under this folder.
  #
  # `placeholder_when_empty` KEEPS THE FOLDER IN THE TREE. A source that yields
  # no rows contributes no doc_path, so "Legislation | Instructions" would simply
  # not exist in the library -- and a reviewer comparing the library against the
  # site's menu would read that absence as a gap in coverage rather than as the
  # accurate statement that CBJ publishes nothing here. The placeholder row says
  # so explicitly and points at the page.
  #
  # IF IT EVER REPORTS DOCUMENTS, check the overlap against Instructions_ before
  # promoting the rows: the two pages plainly share a subject.
  - name: "Instructions"
    mode: generic
    seed_url: "https://www.cbj.gov.jo/EN/List/Instructions"
    scope: prefix
    strategy: generic
    source_system: "Legislation"
    category: "Instructions"
    doc_path_category: true
    doc_path_title: true
    include_pages: never
    placeholder_when_empty: "Instructions (no documents published on this page)"
    max_pages: 1
    max_depth: 0

  # ---- 5. Official Holidays -----------------------------------------------
  # MEASURED 2026-09-16 on the export of this config:
  #   documents   83   all PDF
  #   breadcrumb  ['Home', 'About Bank', 'Official Holidays circulars']
  #   titles      human-readable, e.g. "circular no. (10-2026)"
  #   duplicates  none -- hence no `merge_files_at_same_path`, on the same test
  #               the Payment Systems source states
  #
  # THIS PAGE IS NOT UNDER LEGISLATION ON THE SITE. Its crumb reads
  # "Home > About Bank > Official Holidays circulars" -- CBJ files it under About
  # Bank. Neither crumb repeats source_system or category, so `_clean_trail`
  # cannot remove either, and the first export filed all 83 rows at
  #
  #   CBJ | Legislation | Official Holidays | About Bank |
  #       Official Holidays circulars | <title>
  #
  # -- six levels, two deeper than all nine siblings. The earlier
  # `drop_sections: ["Legislation", "Legislations"]` here was a guess copied from
  # the measured siblings and matched nothing on this page.
  #
  # DECIDED 2026-09-16: the source STAYS under Legislation in the library, and
  # the two site crumbs are dropped so it sits level with its siblings.
  #
  # THAT COSTS NO INFORMATION, and this is the reason it is allowed to. The two
  # keys act in different places: `drop_sections` filters only inside `_doc_path`
  # (generic_crawler_wrapper.py `_doc_path`), while the DOCUMENT-row path stores
  # `extra_meta["section_path"] = sec` from the raw crumb, before and independent
  # of any dropping (`_doc_from_document_row`). So the folder trail reads
  # "CBJ | Legislation | Official Holidays | <title>" while every row still
  # records "Home > About Bank > Official Holidays circulars" -- the site's
  # actual placement stays auditable in the workbook.
  #
  # DO NOT COPY THIS TO A PAGE-ROW SOURCE. `_doc_from_page_row` deliberately
  # omits section_path from extra_meta ("duplicates doc_path"), which is true
  # only while the crumb is IN doc_path. Dropping a crumb there loses it
  # outright -- see source 10, which for exactly this reason drops no crumb and
  # carries no `category`.
  - name: "Official Holidays"
    mode: generic
    seed_url: "https://www.cbj.gov.jo/EN/List/Official_Holidays"
    scope: prefix
    strategy: generic
    source_system: "Legislation"
    category: "Official Holidays"
    doc_path_category: true
    doc_path_title: true
    # The first two are MEASURED and load-bearing -- they are this page's real
    # crumbs. The last two are defensive, for the reason the Circulars source
    # gives: a crumb whose wording drifts would file this source deeper again.
    # `drop_sections` matches on exact lowercase equality, so each spelling has
    # to be listed in full.
    drop_sections: ["About Bank", "Official Holidays circulars",
                    "Legislation", "Legislations"]
    include_pages: never
    max_pages: 1
    max_depth: 1

  # ---- 6. Regulations and Instructions ------------------------------------
  # By far the largest listing, and the one with the trailing underscore.
  #
  # MEASURED 2026-09-10 by loading the page and running the extraction JS:
  #   breadcrumb   ['Home', 'Legislation', 'Regulations']
  #   doc links    116 sightings -> 106 unique documents
  #   extensions   84 pdf, 17 docx, 4 doc, 1 xlsx
  #   guid titles  0 -- every one already human-readable
  #
  # THE BREADCRUMB DISAGREES WITH THE URL. The page is /EN/List/Instructions_ and
  # its own documents are titled "Instructions for ...", but the site files it
  # under a crumb reading "Regulations". `category` follows the url and the
  # documents rather than the crumb, because that is what the instruments call
  # themselves and what a reviewer will look for.
  #
  # "Regulations" IS THE ONE CRUMB THAT HAS TO BE DROPPED BY HAND. It repeats
  # neither source_system ("Legislation") nor category ("Regulations and
  # Instructions") -- `_crumb_key` compares whole crumbs, not substrings -- so
  # `_clean_trail` cannot remove it. Left in, the trail would read
  # "CBJ | Legislation | Regulations and Instructions | Regulations | <title>":
  # a level deeper than its nine siblings, for a folder whose name contradicts
  # the one directly above it.
  - name: "Regulations and Instructions"
    mode: generic
    seed_url: "https://www.cbj.gov.jo/EN/List/Instructions_"
    scope: prefix
    strategy: generic
    source_system: "Legislation"
    category: "Regulations and Instructions"
    doc_path_category: true
    doc_path_title: true
    drop_sections: ["Legislation", "Regulations"]
    include_pages: never
    # ESSENTIAL HERE, not just tidy. 106 documents across four file types, and
    # MEASURED at least five titles published twice -- e.g. "Instructions of
    # Corporate Governance for Banks No. (2/2023)" and "Instructions on the
    # Implementation of Financial Accounting Standards No (6/2020)". Without this
    # each pair is two rows competing for one folder node.
    merge_files_at_same_path: true
    max_pages: 1
    max_depth: 1

  # ---- 7. Bylaws ----------------------------------------------------------
  # NOT MEASURED. Added 2026-09-16 from the site's Legislation menu without a
  # crawl. Same standing as Official Holidays above: the settings are the
  # measured siblings' shape, not findings about this page.
  #
  # ONE THING TO EXPECT. Bylaws are secondary legislation issued under the Laws
  # in source 8, so a title appearing in both listings is plausible and is NOT a
  # duplicate to be merged away. `merge_files_at_same_path` only ever folds rows
  # landing on the SAME doc_path, and these two sources sit in different category
  # folders, so it could not fold them even if set. Cross-listing is handled by
  # the dedupe key being (url, folder path), which is deliberate: each listing is
  # its own place in the library.
  #
  # TO VERIFY: document count, file types, repeated titles within this listing
  # (which decide `merge_files_at_same_path`), and the breadcrumb's exact wording.
  - name: "Bylaws"
    mode: generic
    seed_url: "https://www.cbj.gov.jo/EN/List/Bylaws"
    scope: prefix
    strategy: generic
    source_system: "Legislation"
    category: "Bylaws"
    doc_path_category: true
    doc_path_title: true
    drop_sections: ["Legislation", "Legislations"]
    include_pages: never
    max_pages: 1
    max_depth: 1

  # ---- 8. Laws ------------------------------------------------------------
  # MEASURED 2026-09-10 by loading the page and running the extraction JS:
  #   breadcrumb   ['Home', 'Legislation', 'Laws']
  #   doc links    16 sightings -> 8 unique documents, all PDF
  #   titles       every one already human-readable, e.g.
  #                "Banking Law No. 28 of 2000 and its amendments"
  #                "Central Bank of Jordan Law No. 23 of 1971"
  #                "Insurance Regulatory Law No. (12) of 2021"
  #
  # `drop_sections` is redundant here -- "Legislation" repeats source_system and
  # "Laws" repeats category, so `_clean_trail` removes both unaided. Kept for the
  # reason the Circulars source gives: a crumb whose wording drifts (to
  # "Legislations", say) would otherwise file this source deeper than its
  # siblings, silently.
  - name: "Laws"
    mode: generic
    seed_url: "https://www.cbj.gov.jo/EN/List/Laws"
    scope: prefix
    strategy: generic
    source_system: "Legislation"
    category: "Laws"
    doc_path_category: true
    doc_path_title: true
    drop_sections: ["Legislation", "Legislations"]
    include_pages: never
    # ONE LAW IN TWO FORMATS IS ONE ROW. MEASURED on the 2026-09-10 export of this
    # source, 8 rows -> 7 doc_paths: two instruments are published twice, as .pdf
    # and .docx:
    #
    #   banking_law_no._28_of_2000_and_its_amendments.pdf / .docx
    #   Central Bank of Jordan Law No. 23 of 1971         (both guid-named urls)
    #
    # They survived as four rows because document_url is a third of the default
    # identity. This folds each pair into the multi-attachment shape --
    # document_url empty, both files in extra_meta.attachment_links -- the same
    # call config/sources/cbb.yml makes for its Arabic/English resolution pairs.
    merge_files_at_same_path: true
    max_pages: 1
    max_depth: 1

  # ---- 9 & 10. THE TWO /EN/Pages/ SOURCES ---------------------------------
  # BOTH ARE NAVIGATION STUBS. MEASURED 2026-09-16, first by the engine and then
  # by a raw fetch of each url, because the engine alone cannot tell "the page has
  # no content" from "the extractor missed it":
  #
  #                             Jordanian_Constitution   AntiMoney_Laundering__...
  #   engine documents                    0                        0
  #   engine n_pdfs                       0                        0
  #   engine text_len                 6,905                    6,905   (chrome)
  #   raw HTTP                          200                      200
  #   raw bytes                     276,255                  282,417
  #   raw .pdf/.doc/.xls links            0                        0
  #   raw <iframe>/<embed>                0                        0
  #   raw "Article"                       0                        0
  #   raw "Hashemite"                     0                        0
  #
  # The only hits for "Constitution" (14) and "Money Laundering" (8) are the site
  # NAV, which lists the whole Legislation menu on every page -- both words appear
  # on BOTH pages for that reason. So neither page carries its instrument, as text
  # or as a file: ~280KB of markup that is chrome and menu.
  #
  # WHAT THIS SETTLES, AND WHAT IT DOES NOT. It settles that
  # `include_pages: always` was wrong: it produced one row per page whose
  # document_text was the accessibility widget -- the "title is a cookie banner"
  # case docs/ONBOARDING.md warns about, which `check` cannot see (it passed 402
  # rows with zero errors) and which the stability re-export cannot see either,
  # because chrome text is stable so content_hash is stable. Only a reader caught
  # it. It does NOT settle where CBJ actually publishes these two instruments;
  # nothing here links them.
  #
  # SO BOTH GO TO `include_pages: never` PLUS A PLACEHOLDER -- the same call
  # source 4 (Instructions) makes, for the same reason: a menu entry that
  # publishes nothing. Their folders stay in the tree saying so, rather than
  # vanishing and reading as a coverage gap, and no chrome is promoted as an
  # instrument.
  #
  # `category` IS REQUIRED FOR THAT, including on the AML source where it was
  # deliberately removed while `include_pages: always` stood. The placeholder
  # trail is `[regulator, source_system] + category if set` (the `not out and
  # self.placeholder_when_empty` branch), so without one the row lands directly
  # under "Legislation" with no folder of its own. Re-adding it cannot bring back
  # the five-level duplication that removing it fixed, because that duplication
  # came from the PAGE ROW's crumb and `include_pages: never` means there is no
  # page row. It is spelled as the SITE spells it either way -- measured crumb
  # "Home > Legislation > Anti-Money Laundering & Countering the Financing of
  # Terrorism" -- so a future `include_pages` change would dedupe rather than
  # repeat.
  #
  # NOT max_depth: 1 ANY MORE on the AML source. That level was there on the
  # theory that an AML/CFT hub links the regime's instruments off it. Measured:
  # it links none, so the level only invites the walk out of the page for nothing.
  #
  # IF EITHER PAGE EVER GAINS A FILE, the placeholder self-retires -- a real
  # document at or below the folder drops the mark (the `record_kind ==
  # "placeholder"` prune below `_merge_same_path`). Both still want a reader's
  # eye at that point, to check the file is CBJ's own and not another
  # regulator's: config/sources/mlcu.yml is the national AML unit for Egypt, and
  # a central bank's AML page is often a link list to its FIU.
  - name: "Jordanian Constitution"
    mode: generic
    seed_url: "https://www.cbj.gov.jo/EN/Pages/Jordanian_Constitution"
    scope: prefix
    strategy: generic
    source_system: "Legislation"
    category: "Jordanian Constitution"
    doc_path_category: true
    doc_path_title: true
    # Measured crumb is "Home > Legislation > Jordanian Constitution": "Home"
    # goes as a CMS crumb, "Legislation" repeats source_system, and the last
    # repeats category -- so this key is defensive only, like its siblings'.
    drop_sections: ["Legislation", "Legislations"]
    include_pages: never
    placeholder_when_empty: "Jordanian Constitution (CBJ links no file on this page)"
    max_pages: 1
    max_depth: 0

