  # ---- 11-13. THE THREE AML CHILDREN --------------------------------------
  # The AML page above is a HUB, not a leaf: it links three listings of its own,
  # each behind a "Click here". They are sources rather than a deeper crawl of
  # the parent because `scope: prefix` pins the parent's walk under /EN/Pages/
  # and these three live under /EN/List/ -- a different path, so no `max_depth`
  # could reach them. Seeding each at its own url is also what every other
  # listing in this file does.
  #
  # ALL THREE ARE EMPTY TODAY. MEASURED 2026-09-16 by fetching each and counting
  # links into the site's document store, with /EN/List/Laws as a control to
  # prove the method sees links when they exist:
  #
  #   /EN/List/Laws                                 (control)   8 documents
  #   Instructions_AntiMoney_..._Instructions                    0
  #   Circulars_AntiMoney_Laundering_and_Terrorist_Financing     0
  #   Guidelines                                                 0
  #
  # So these three contribute NOTHING until CBJ publishes. They are configured
  # now because the hierarchy they will need is measurable now, and because a
  # listing nobody has declared is a listing nobody notices filling up.
  #
  # NO `placeholder_when_empty` ON ANY OF THEM, and this is the one setting that
  # cannot simply be copied from their siblings. The placeholder trail is
  # `[regulator, source_system] + category` -- it ignores the breadcrumb -- so
  # all three would resolve to the SAME three-level trail
  # "CBJ | Legislation | Anti-Money Laundering & ...". `_walk_folders` types a
  # last segment R and refuses to hand one document's leaf to another, so the
  # second and third would each get a same-named SIBLING: three identical
  # "Anti-Money Laundering & ..." nodes, the failure
  # dynamic_crawler/formfill/pipeline.py records as MOE's 28 siblings all called
  # "Special Education". The parent's placeholder above marks the area instead.
  #
  # THE SUBFOLDER LEVEL COMES FROM THE SITE, NOT FROM THIS FILE. MEASURED
  # breadcrumbs, all three:
  #
  #   Home > Legislation > Anti-Money Laundering & Countering the Financing of
  #        Terrorism > <subfolder>
  #
  # `category` below is character-for-character that third crumb, so
  # `_clean_trail` folds it out and the FOURTH crumb survives as the subfolder --
  # the same mechanism the Official Holidays source uses in reverse. That is why
  # no wrapper change is needed to nest these, and why the category spelling here
  # is not cosmetic: change one character and the trail grows a fifth level.
  #
  # THE SUBFOLDER NAMES ARE THE SITE'S OWN AND READ ODDLY -- "Instructions
  # Anti-Money Laundering and Terrorism Financing Instructions" says
  # "Instructions" twice. That is what the breadcrumb says, and this file's rule
  # is to mirror the site rather than to improve on it. Renaming them would also
  # break the dedupe described above.
  - name: "AML — Instructions"
    mode: generic
    seed_url: "https://www.cbj.gov.jo/EN/List/Instructions_AntiMoney_Laundering_and_Terrorism_Financing_Instructions"
    scope: prefix
    strategy: generic
    source_system: "Legislation"
    category: "Anti-Money Laundering & Countering the Financing of Terrorism"
    doc_path_category: true
    doc_path_title: true
