# ---------------------------------------------------------------------------
# Listed under "United States of America" as
#     - "Dodd-Frank Wall Street Reform and Consumer Protection Act"
#
# It was deliberately NOT added when this file was first written, because a
# dfa.yml had been written and deleted once already that week and its
# countries.yml entry outlived it as a dangling reference an audit had to catch.
# The first export settled that, and `check` had warned on it exactly as this
# section predicted: "its folders will stay at the tree root".
#
# THAT STRING AND `regulator:` BELOW MUST STAY BYTE-IDENTICAL, including the
# absence of "(DFA)". country_for() matches EXACTLY and a near miss does NOT
# error — it silently drops the regulator to the tree root, which is what
# happened to QFCL on 2026-09-28.

# ---------------------------------------------------------------------------
# ONBOARDING Step 8 — DONE 2026-10-05. SIGNAL: crawl. SLOT: sun 00:00, DISABLED.
# ---------------------------------------------------------------------------
# `crawl` IS THE RESIDUAL HERE, NOT A PREFERENCE. Step 8 lists five signals and
# four were ruled out by measurement, in four requests:
#
#   stored-inventory  version_token(page) -> ('', 'probe-failed') in 0.7s. The
#                     same request by hand: HTTP 403, Server: cloudflare,
#                     CF-Mitigated: challenge, <title>Just a moment...</title>,
#                     NO ETag and NO Last-Modified. There is no token to read.
#   sitemap           robots.txt answers 200 (2,027 bytes) and names NO
#                     `Sitemap:` line. 34 Disallow rules, none matching our path.
#   snapshot-articles one article page, not a listing holding many.
#   sama-feed         Heritage publishes no "what changed" feed, and is not this
#                     Act's publisher in any case.
#
# A CHALLENGE IS NOT A BLOCK, and that distinction is what makes this wirable.
# robots.txt answering 200 from the same address says we are unverified, not
# banned — so this is NOT a skip_hosts case like saudiexchange.sa or simah.com,
# where there is nothing to solve. A browser clears it and the supervised run
# did, with 0 retries. It must not BECOME a block by being retried badly:
# ONBOARDING section 3, "a scheduled retry is not a way out of a block — it is
# what makes one." If a scheduled run is refused it reports blocked. Leave it.
#
# TWO SAFETY PROPERTIES WERE CHECKED BEFORE SCHEDULING A CRAWL AGAINST A
# CHALLENGED HOST, because a refusal can fail in two opposite directions:
#
#   1. THE RUN RETURNS NOTHING. One stored row, zero observed — a 100% drop.
#      withdrawal.count_drop(0, 1) returns None: the allowance is
#      max(1, 5% of 1) = 1 and the loss is exactly 1, SO THE COUNT GATE IS INERT
#      on a one-row source. What refuses is withdrawal.gate's empty-run rule
#      ("the sweep observed nothing"). Both were called. Written down because the
#      count gate is the one a reader assumes is doing the work.
#   2. THE RUN STORES THE CHALLENGE AS THE DOCUMENT, which is worse — the row
#      survives and its hash becomes the hash of an interstitial. MEASURED:
#      blockcheck.text_is_blocked("Just a moment...") -> "Just a moment", and the
#      real title "The Dodd-Frank Act" -> "" (no false positive).
#
# CONFIRM IS FALSE. `confirm` re-hashes visible text when a version TOKEN cannot
# be trusted; there is no token here, and `crawl` already hashes the text as its
# primary act.
#
# THE SLOT IS SUNDAY 00:00 — Saturday's US chain continuing past midnight
# (21:00 fdic, 22:00 fincen, 23:00 ffiec, 00:00 dfa), keeping the two
# browser-driven challenged jobs last. It was first written as sun 22:00, which
# is already held by monitor_nca — and that job ships ENABLED, so this one would
# have lost `_run_exclusive`'s single global lock and been skipped every week,
# silently. Sunday 00:00 has four clear hours before monitor_mc at 04:00.
#
# ENABLED: FALSE, and it stays that way until a person has read the workbook.
# A detected change goes through `_crawl_into_db`, which writes STRAIGHT TO
# MSSQL, so enabling it first would make the first scheduled run the ingest.
#
# WHAT NOTHING WATCHES: Public Law 111-203. The statute was briefly carried here
# as a declared govinfo source and has been removed, so this job watches a
# commentary page about the Act and no part of this library watches the Act. If
# that is wanted it is a declared source again, and GPO serves it a real
# `last-modified`.

