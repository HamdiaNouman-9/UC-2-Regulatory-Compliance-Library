# MISA — Ministry of Investment of Saudi Arabia
#
# One file per regulator. A regulator is a LIST OF SOURCES; each source is one
# seed URL and says how it is crawled:
#
#   mode: generic  -> the shared engine. No python, no selectors. Just a seed URL.
#   mode: custom   -> a hand-written crawler class, for sites the engine can't do.
#
# Both produce List[RegulatoryDocument], so the pipeline cannot tell them apart.
#
# Two optional keys per source decide how change detection matches a document
# against the one already stored. Set them on the source, not on the regulator —
# a grid with a reference number and a link walk without one need different
# answers. A top-level value serves as the default for sources that omit them.
#
#   identity: [reference_no]   what makes two documents "the same document".
#                              Default [document_url, doc_path]. Every field
#                              blank on a document aborts the run rather than
#                              silently merging it with the next one.
#   version_key: reference_no  the field that recognises the same document
#                              republished at a NEW url. `null` switches it off.
#
# Run it:
#   venv/Scripts/python.exe jobs/run_regulator.py MISA --dry-run     # nothing written
#   venv/Scripts/python.exe jobs/run_regulator.py MISA               # full pipeline

# MUST MATCH `regulations.regulator` EXACTLY. This file used the bare
# acronym while every stored row carries the full name, written by the
# hand-written crawler / formfill form that actually produced them. The
# value was dormant because no crawl had ever run through this config --
# but `regulator` becomes doc_path[0], which is an identity field, so the
# first run under the short name would have matched nothing, inserted the
# whole regulator again as `new`, and left `disappeared` silent because it
# scopes by regulator and would have found no rows under the short name.
# Corrected 2026-08-20, before any such run.
regulator: "Ministry of Investment (MISA)"
owner: teammate B

sources:
  - name: "Laws and Regulations"
    mode: generic
    seed_url: "https://misa.gov.sa/activities/laws/"
    scope: prefix          # 'auto' once auto-scope is merged
    source_system: "MISA-LAWS"
    # The site's own tab is "Laws", not "Laws and Regulations".
    category: "Laws"
    max_pages: 150
    max_depth: 8
    # Measured 2026-08-01: 94 documents — 68 PDF, 24 external law-portal pages
    # (laws.boe.gov.sa, mc.gov.sa, moj.gov.sa, pr.gov.sa), 2 content pages,
    # across 17 folder paths. See generic_crawler/MERGE_LOG.md.
