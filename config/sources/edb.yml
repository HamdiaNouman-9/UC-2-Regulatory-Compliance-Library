# NOT LISTED, DELIBERATELY:
#   /all-laws/all-laws is the index of all 64 and would duplicate every row in
#     the eight category folders. It is useful as a DISCOVERY cross-check — one
#     request naming every law — not as a stored source.
#   /constitution and /chief-executive-message are not business laws.
#   /all-laws-ar/* is a COMPLETE ARABIC MIRROR of all eight categories. Arabic is
#     the authoritative text in Bahrain and English is a translation, so this is a
#     real gap, not an oversight — it was scoped out on 2026-08-19 and doubles the
#     corpus to 128. Adding it is eight more entries here, not a rethink.
