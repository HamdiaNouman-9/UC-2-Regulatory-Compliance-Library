  - regulator: "Ministry of Labour and Social Development (MLSD)"
    source_system: "Legislation and Regulations"
    signal: crawl
    confirm: true

  # LMRA (BAHRAIN) - `crawl` IS A MEASURED CONCLUSION.
  #
  # An instrument is normally an HTML PAGE carrying its own full text.
  # MEASURED 2026-08-20:
  #   ETag                   ABSENT everywhere.
  #   Last-Modified          ABSENT on every DYNAMIC page; PRESENT on the static
  #                          files under /files/cms/. Only 3 of the 46 documents
  #                          draw text from such a file, so it cannot carry a
  #                          probe - it is kept per row as pdf_last_modified.
  #   robots.txt / sitemap   both 404. /en/page/show/446 is a human sitemap page,
  #                          not XML with lastmod.
  #   a publisher feed       NONE that says what CHANGED. The listings badge a
  #                          POSTING date, not the instrument's - Resolution
  #                          1/2014 is badged 29-03-2026.
  #   raw body sha256        STABLE - 3 fetches each of a listing, an instrument
  #                          and an article page, all byte-identical.
  #   `#page_content` text   STABLE across those same 3.
  #
  # The crawl is 97 requests; a probe would cost 46 and could not discover a new
