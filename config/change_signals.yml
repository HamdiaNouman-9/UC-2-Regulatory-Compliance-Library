  # NBR (BAHRAIN) - `crawl` IS A MEASURED CONCLUSION, AND AN UNUSUAL ONE:
  # this is the rare source where an honest ETag EXISTS and is still not used.
  #
  # An instrument here is a PDF ON S3 behind a `/media/<slug>` permalink; the
  # permalink page is an Adobe viewer shell whose own visible text is 36
  # characters. MEASURED 2026-08-31:
  #   ETag / Last-Modified   BOTH PRESENT on every one of the seven S3 objects,
  #                          and ABSENT on every `/media/` page and on the
  #                          listing. So a stored-inventory sweep could only work
  #                          if document_url were the S3 url - and it must not be.
  #                          S3 keys are Laravel upload hashes: a replaced file
  #                          gets a NEW key, so an S3 document_url reads as one
  #                          `disappeared` plus one `new` on every amendment and
  #                          loses the version chain. Worse, the sweep would keep
  #                          probing the OLD key, which stays 200 with an
  #                          unchanged ETag for as long as the orphaned object
  #                          survives - reporting `unchanged` FOREVER while the
  #                          site serves a different file. A silent permanent
  #                          miss is the one failure mode worth paying to avoid.
  #                          The validators are kept per row as s3_etag and
  #                          s3_last_modified so a reviewer can still see them.
  #   robots.txt             200, `Disallow:` empty - everything allowed.
  #   sitemap.xml            404.
  #   a publisher feed       NONE. /announcements and /releases are news; neither
  #                          says which instrument moved.
  #   raw body sha256        NOT STABLE - every response carries a fresh
  #                          `<meta name="csrf-token">`, so a body hash moves on
  #                          every fetch. The fingerprint is the PDF text.
  #   BURST THROTTLING       REAL. Six unpaced requests in one session returned
  #                          403 on everything; one paced request 45s later
  #                          returned 200. The crawler paces at 3s, backs off 15s
  #                          on a 403 and never treats one as an answer.
  #
  # The crawl is 18 requests and ~3.9 MB, and it DISCOVERS A NEW INSTRUMENT,
  # which no probe can.
  #
  # `confirm: true` is recorded, not exercised; these are FILES, so confirm would
  # hash their bytes, which is the right basis for a PDF.
  #
  # IDENTITY DIFFERS BY ROW, and change_signals has nothing to keep in step
  # because the crawler DECLARES it per document. Reshaped 2026-09-01 on review:
  # ONE ROW IS ONE `<h2>` SECTION of the page, not one PDF. THREE rows carrying
  # SEVEN PDFs. The one-PDF row (the GCC Agreement) keeps `document_url` and the
  # default identity; the two three-PDF rows leave it empty and declare
  # `identity_fields: [doc_path, extra_meta.attachment_links, title]`, which is
  # the contract in models.RegulatoryDocument and what `check` enforces.
  #
  # THE STORED FILE URLS ARE THE S3 PDFs, not the `/media/` viewer pages. So a
  # re-upload rotates the key and the row reads `new` + `disappeared` rather than
  # `modified` - the cost models.py already names for multi-file rows. The stable
  # `/media/` permalink is kept beside every file as `media_page`.
  #
  # Measured 2026-09-01: 3 rows, 3 distinct titles, 3 distinct hashes, 0 blank,
  # 7 distinct file urls, no `/media/` page stored as a file.
  #
  # A CHEAPER SIGNAL EXISTS AND IS NOT IN THIS FILE'S VOCABULARY, measured
  # 2026-08-31 after the first delivery. A NORMALISED PAGE-SNAPSHOT HASH: one GET
  # of the listing, strip the per-request token and the site's now() stamp, hash
  # the rest. Two fetches six seconds apart differ in EXACTLY SIX PLACES and every
  # one is inside `<meta name="csrf-token">`; byte length is identical (87,044)
  # because the token is fixed-length.
  #
  # IT IS A TRAP WITHOUT THE SECOND STRIP. Every NBR page carries
  # "Last Updated: <date>" and that date is now() - it read as TODAY on the VAT,
  # excise, dmtt, decisions, a /media/ page and /about_NBR alike. Three same-day
  # fetches look perfectly stable, which is how this gets adopted by mistake.
  # Simulating a date rollover: csrf-stripped-only changes (a FALSE CHANGE EVERY
  # DAY, the CMA pathology that cost 1,134 of them); csrf+stamp-stripped does not.
  #
  # WARNING TO WHOEVER MAKES THIS CHEAPER LATER. `inventory_sweep._visible_text`
  # strips all TAGS, so the csrf token is handled for free - but it KEEPS visible
  # text, and the now() stamp is visible text in a <div>. So switching any
  # nbr.gov.bh source to `stored-inventory` + `confirm: true` yields a confirm
  # hash that moves daily on every page. This source is unaffected today:
  # `confirm` is read only by cli/sweep.py when it builds a StoredInventorySweep,
  # and `signal: crawl` never constructs one, so the flag below is inert.
  #
  # FULL CHEAP COVERAGE would be three tiers - listing snapshot (1 request:
  # add/remove/retitle/relink), /media/ page snapshot (7: the S3 key rotating),
  # S3 ETag HEAD (7: bytes changing at an unchanged key) = 15 tiny requests, no
  # downloads, no OCR, against `crawl`'s 18 requests + 3.9 MB + OCR.
  #
  # KEPT ON `crawl` DELIBERATELY at SEVEN documents: the saving does not justify a
  # new signal type plus a normaliser that must track NBR's template, and the
  # crawl DISCOVERS new documents, which tiers 2 and 3 structurally cannot. The
  # arithmetic flips at roughly 65 documents (VAT + excise + dmtt + decisions +
  # clarifications + the 40 guidelines) - build it then, with the numbers above.
  - regulator: "National Bureau for Revenue (NBR)"
    source_system: "Laws and Executive Regulations"
    signal: crawl
    confirm: true

  # JUSTICE CANADA (CANADA) - `stored-inventory`, AND IT IS THE FIRST SOURCE
  # SINCE ZATCA WHERE A CHEAP PROBE IS GENUINELY THE RIGHT ANSWER. Measured
  # 2026-09-09 and re-measured 2026-09-13; artefacts in
  # UC-2-Scratch/JUSTICE_CANADA/cache/.
  #
  # EDB, MLSD, LMRA and NBR are all `crawl` because every cheap option failed.
  # Here one succeeds: `/eng/XML/<CODE>.xml` returns BOTH an ETag and a
  # Last-Modified, and unlike CMA's they are HONEST — the file is rewritten only
  # when Justice re-cuts that Act. Proof is the acts that were NOT rewritten:
  #
  #     act     the page says       its XML says     its XML file written
  #     B-3     current to 2026-06-21  2026-06-21    2026-08-20 14:10:00
  #     C-21    current to 2026-06-21  2026-06-21    2026-08-20 14:10:00
  #     I-21    current to 2026-06-21  2024-12-08    2025-01-14 15:26:00
  #     F-27    current to 2026-06-21  2025-03-31    2025-04-29 18:44:48
  #     P-21    current to 2026-06-21  2026-03-02    2026-03-18 15:59:48
  #     A-17    current to 2026-07-21  2022-08-08    2022-08-17 17:26:53
  #     F-3.3   current to 2026-07-21  2019-06-21    2019-09-24 15:23:20
  #
  # Every page advertises the same currency date because it is injected at
  # render time; the FILES tell the truth. The last two rows are the strongest:
  # F-3.3 advertises 2026-07-21 over a file untouched since SEPTEMBER 2019.
  #
  # ONE HEAD PER ACT replaces downloading the Act, and there are NINE documents,
  # so the sweep is nine requests. That matters more than it did at four: the
  # Income Tax Act, added 2026-09-17, is 14 MB of XML. Its HEAD is the same
  # single cheap request as any other Act, and the probe is what stops the sweep
  # downloading it every week to learn nothing.
  #
  # THE PROBE WAS RE-RUN 2026-09-13, FOUR DAYS AND ONE BANNER ROLL LATER. The
  # site-wide banner moved 2026-06-21 -> 2026-07-21 in that window. All four
  # Acts returned byte-identical ETag and Last-Modified to the values recorded
  # on 2026-09-09 — so the roll did NOT move the files, and the detect half
  # reported zero changes across it. That is the false-positive control this
  # signal most needed, and it passed.
  #
  # `confirm: true`, AND THE MEASUREMENT IS AMBIGUOUS RATHER THAN ALARMING.
  # B-3, C-21, C-46 and B-1.01 were all rewritten in one batch at 2026-08-20
  # 14:10:00, but B-1.01's last amendment was 2026-03-26 — months earlier.
  # Either its text really changed in the June cycle (its point-in-time index
  # carries a 2026-06-18 version, which supports that) or the batch re-cut it
  # and only the currency date moved. The second case is a false `modified`.
  # Confirming costs one fetch on the documents that actually moved and is
  # correct under either reading.
  #
  # STILL NOT SETTLED as of 2026-09-17. The 2026-09-13 re-probe does not settle
  # it: that showed a BANNER roll does not rewrite the files, which is a
  # different question. B-1.01 asks whether a FILE rewrite always means the text
  # changed, and answering it needs a rewrite to happen to a document we already
  # hold a baseline for.
  #
  # The five Acts added 2026-09-17 make that likelier rather than answering it.
  # Three of them had been rewritten since 2026-08-20 — F-11 on 2026-09-11, and
  # A-1 on 2026-07-22 — so rewrites in this corpus are ordinary, not rare. They
  # prove nothing yet because there was no stored baseline to compare against;
  # the first sweep after this workbook is promoted is the one to read. Keep
  # `confirm: true` until then.
  #
  # PROBE THE XML, NOT THE PDF — AND THE PROBE TARGET IS `document_url`.
  # `inventory_sweep.py` HEADs whatever is in `document_url`, so that column is
  # the signal, not just a link. It is the XML deliberately. Swapping it to the
  # PDF is the obvious-looking improvement, because a reviewer opening raw XML
  # is nobody's idea of readable, and it would quietly ruin this signal.
  #
  # Measured 2026-09-17, XML against PDF, nine Acts plus the I-21 and F-27
  # controls:
  #
  #     act     XML Last-Modified   PDF Last-Modified
  #     B-3     2026-08-20          2026-08-31
  #     A-17    2022-08-17          2026-08-31
  #     F-3.3   2019-09-24          2026-08-31
  #     P-21    2026-03-18          2026-08-31
  #     I-3.3   2026-08-20          2026-08-31
  #     I-21    2025-01-14          2026-08-31   (control, never re-cut)
  #     F-27    2025-04-29          2026-08-31   (control, never re-cut)
  #     F-11    2026-09-11 14:43    2026-09-11 15:06
  #
  # TEN OF ELEVEN PDFs CARRY ONE IDENTICAL TIMESTAMP, including Acts whose text
  # has not moved since 2019 and 2022 and both controls. The PDFs are bulk
  # re-rendered, so their Last-Modified is a SITE-WIDE BATCH STAMP — the same
  # family as the "Act current to" banner and CMA's Last-Modified.
  #
  # F-11 is the other half: a real re-cut moved the XML at 14:43 and the PDF at
  # 15:06. So the PDF never MISSES a change; it also fires for hundreds that did
  # not happen. Probing it would report all nine Acts modified on every bulk
  # re-render and crawl ~19 MB, the Income Tax Act being 14 MB of it. `confirm:
  # true` would stop false version rows — the hash basis is the XML either way —
  # so the data would survive and the signal would not.
  #
  # The reviewer's readable link is `source_page_url` (the Act's landing page),
  # which is a first-class column on every row. `extra_meta.pdf_url` holds the
  # PDF but overflows into the sidecar on eight of nine rows, so it is recorded
  # and not legible; see the findings doc.
  #
  # `UC-2-Scratch/JUSTICE_CANADA/harness/content_accuracy_proof.py` ASSERTS that
  # document_url is the XML, so a later swap fails a test instead of passing
  # review.
  #
  # NOTE ON THE ETag: B-3 and C-21 return the SAME ETag ("0ac4b96ad30dd1:0")
  # despite being 1.1 MB and 146 KB. IIS derives it from the file's write time
  # and both were written in the same second. Harmless — a token is only ever
  # compared against that same document's previous token, never across
  # documents — but startling enough to record.
  #
  # NO `sama-feed` EXISTS HERE. Looked for first, as the onboarding directs:
  # robots.txt, sitemap.xml and every "recently amended" url tried are 404.
  - regulator: "Department of Justice Canada (JUS)"
    source_system: "Consolidated Acts"
    signal: stored-inventory
    confirm: true

  # ---------------------------------------------------------------------------
  # GOVINFO (GPO) (CANADA, by the business team's classification) — ONE
  # DOCUMENT, AND THE ONLY SOURCE HERE THAT SHOULD NEVER
  # REPORT A CHANGE AT ALL
  # ---------------------------------------------------------------------------
  # Added 2026-09-22. `confirm: true`, and the reasoning is the inverse of most
  # entries: the probe token is not merely unreliable, EVERY DATE THIS PUBLISHER
  # OFFERS IS THE SAME BULK RE-INGEST STAMP.
  #
  #     HTTP Last-Modified (.htm and .pdf)   Sun, 04 Jan 2026 06:02:27 GMT
  #     MODS <recordChangeDate>              2026-01-04
  #     sitemap <lastmod>                    2026-01-04T06:03:00.018Z
  #
  # They agree because they are ONE EVENT. Measured 2026-09-22: the PLAW 2001
  # sitemap holds 108 public laws and ALL 108 carry a lastmod inside one ~90
  # minute window that morning. Nothing happened to 108 enacted laws that day.
  # Six unrelated packages spanning 1970 to 2020 were checked the same way and
  # every one sits in the same early-January window. This is CMA's
  # `Last-Modified` fault in a third costume.
  #
  # SO THE TOKEN IS A RE-INGEST DETECTOR, NOT A CHANGE DETECTOR. It fires for
  # the whole corpus at once and never in between. `confirm: true` makes the
  # sweep fetch the document and hash it before believing the token, which costs
  # one 460 KB GET on the days GPO re-ingests and nothing on every other day.
  #
  # THE CONFIRM HASH IS THE VISIBLE TEXT, WHICH IS CORRECT HERE. `.htm` is
  # served as `text/html`, so `inventory_sweep.confirm` takes the visible-text
  # branch (inventory_sweep.py:203). The file is one `<pre>` block, so its
  # visible text IS the law — the same basis the crawler hashes. One artefact,
  # one basis, no split.
  #
  # A PUBLISHED SLIP LAW IS FROZEN, which is the real point. GPO prints what
  # Congress enacted and does not amend it afterwards, so the correct long-run
  # behaviour of this signal is to report nothing, forever. A `modified` here is
  # a reason to look at the crawler before believing it. That also means:
  #
  #   THE ROW IS THE LAW AS ENACTED IN 2001, NOT CURRENT U.S. LAW. It was
  #   amended by the USA PATRIOT Improvement and Reauthorization Act (2006) and
  #   the USA FREEDOM Act (2015), and §215 SUNSET on 2020-03-15 unreauthorised.
  #   MONITORING THIS PACKAGE WILL NEVER SURFACE ANY OF THAT, because the
  #   changes did not happen to this document — they happened to other public
  #   laws and to the U.S. Code. No change signal on this url can fix that; only
  #   adding those packages can. See the "NOT LISTED" note in
  #   config/sources/govinfo.yml.
  #
  # PROBE THE .htm, WHICH IS ALSO `document_url`. `inventory_sweep.py` probes
  # whatever is in that column, so it is the signal and not just a link. The PDF
  # would give a marginally stronger token — govinfo returns a real
  # `Content-Range` for it and none for the chunked `.htm`, so the tokens read
  # `'Sun, 04 Jan 2026 06:02:27 GMT|494039'` against
  # `'Sun, 04 Jan 2026 06:02:27 GMT|'`. It is still the `.htm`, because both
  # files carry the SAME stamp — the length is the only difference and it buys
  # nothing against a stamp that is wrong in the same way for both — and because
  # pointing the probe at a different artefact from the one the hash is built on
  # is how two things that must agree come to disagree.
  #
  # NO ETag ON ANY GOVINFO URL, so `dynamic_crawler/fingerprint.py` falls
  # through to `Last-Modified|<length>` (fingerprint.py:81). Both tokens above
  # were stable across repeated probes.
  #
  # THE `sama-feed` EXISTS HERE AND IS NOT WIRED. `api.govinfo.gov/collections/
  # PLAW/<since>` lists every package modified after a timestamp — one request,
  # and it DISCOVERS documents we do not hold, which a probe structurally
  # cannot. It needs an api.data.gov key (verified 2026-09-22: unkeyed returns
  # `401 API_KEY_MISSING`; `api_key=DEMO_KEY` reaches a 400 about `offsetMark`,
  # so only the credential is missing). A key is an operator decision and with
  # ONE document the feed and the probe both cost one request, so there is
  # nothing to gain today. It becomes the right answer the moment a second U.S.
  # law is added.
  - regulator: "United States Government Publishing Office (GPO)"
    source_system: "Public Laws"
    signal: stored-inventory
    confirm: true

  # FINTRAC (CANADA) — two tabs, two signals, one job (monitor_fintrac).
