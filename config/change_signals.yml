  # NO `signal:` KEY, because stored-inventory is the default and this is the
  # plain case for it: the site answers an honest version token per document.
  #
  # KDIPA publishes one instrument and no index worth walking, so
  # config/sources/kdipa.yml declares it (`mode: declared`) rather than crawling
  # for it. The sweep therefore has exactly ONE url to ask about -- one request
  # per run, which is as cheap as this gets.
  #
  # MEASURED 2026-09-08 on that url:
  #     ETag            absent
  #     Last-Modified   Sun, 29 Aug 2021 05:26:19 GMT
  #     Content-Length  278990
  # so `dynamic_crawler/fingerprint.py::version_token` falls to its second tier
  # and returns basis `last-modified+length`.
  #
  # CONFIRM IS FALSE BECAUSE THE TOKEN DOES NOT LIE. That 2021 date matches the
  # file's own /2021/08/ upload path and stands still between runs -- it is not
  # CMA's case, where Last-Modified is the CURRENT TIME and reported 1,134 false
  # changes until `confirm: true` made it hash the visible text instead. Measure
  # before changing this: a needless confirm downloads the file every sweep.
  #
  # THE TWO STRINGS ARE THE SAME ON PURPOSE. `source_system` was set to the
  # regulator name so `_clean_trail` folds it out of doc_path and the tree does
  # not carry a "Regulations" folder holding one document. `settings_for`
  # matches on BOTH halves, so this still resolves to exactly this source.
  - regulator: "REGULATION GOVERNING COLLECTIVE INVESTMENT SCHEME JUNE 2013"
    source_system: "REGULATION GOVERNING COLLECTIVE INVESTMENT SCHEME JUNE 2013"
    confirm: false

  # ---- Jordan ------------------------------------------------------------
  # CBJ, ALL TEN SOURCES IN ONE ENTRY. config/sources/cbj.yml gives every source
  # `source_system: "Legislation"` so the library nests them under one parent
  # folder, and `settings_for` matches on (regulator, source_system) -- so this
  # single pair names the whole regulator. The cost is recorded in cbj.yml: the
  # ten listings cannot be gated apart, because `disappeared` and the
  # completeness gate are scoped on that same pair.
  #
  # MEASURED 2026-09-16, all four alternatives:
  #
  #   sitemap           NONE, and proven rather than assumed. /sitemap.xml and
  #                     /sitemap_index.xml answer 404 in 103 bytes. /EN/sitemap.xml
  #                     answers 200 -- but a control path that cannot exist,
  #                     /EN/List/zzz_control_does_not_exist, answers 200 at the
  #                     IDENTICAL 385,447 bytes of `<!DOCTYPE html>`. That is the
  #                     site's catch-all page, not a sitemap. robots.txt is 404,
  #                     so it names none either.
  #   sama-feed         no "what changed" page anywhere in the Legislation menu.
  #   snapshot-articles wrong shape. It parses one page into labelled articles;
  #                     CBJ's instruments are 399 separate PDFs, not anchors into
  #                     a page. It would parse 0 items.
  #   stored-inventory  AVAILABLE AND HONEST -- and still the wrong nightly
  #                     signal. See the two reasons below.
  #
  # STORED-INVENTORY WORKS HERE, WHICH IS WHY IT IS RULED OUT ON EVIDENCE RATHER
  # THAN ON AVAILABILITY. Every sampled PDF returns a real IIS ETag and a
  # plausible, distinct Last-Modified -- not CMA's case, where Last-Modified is
  # the current time:
  #
  #     etag="6e0ed747da9dc1:0"   Sun, 01 Mar 2026 13:15:21 GMT   250,012
  #     etag="fcf52375516fdc1:0"  Wed, 17 Dec 2025 12:34:16 GMT   345,363
  #     etag="b5efb9d719ddb1:0"   Tue, 25 Mar 2025 10:31:22 GMT   533,576
  #
  # It loses twice over, the same way MOIC's does:
  #
  #   1. COST. A probe is one request per document: 376 against TEN page loads
  #      for the entire regulator, because every source in cbj.yml is
  #      `max_pages: 1` -- CBJ's pagers and category dropdowns are display-only
  #      and the unfiltered markup already carries every link. 376 and not 402:
  #      23 multi-attachment rows leave document_url EMPTY by design and 3 are
  #      placeholders, so 26 rows cannot be probed by anything.
  #   2. COVERAGE. InventorySweep is covers_inventory = False -- it re-reads only
  #      urls already stored and can never see a NEW circular. On this regulator
  #      that is the main event, not an edge case: the register already holds
  #      2026 circulars, and dynamic_crawler/MONITORING.md section 3 says it
  #      outright -- on a list site the listing IS the feed.
  #
  # KNOWN GAP, SAME AS PDPA AND MOIC: a pdf silently replaced at the same url
  # with the same link text is INVISIBLE. A discovered document's content_hash is
  # hash("<url>|<title>") (generic_crawler/crawler.py, "a document is a file we
  # have not downloaded here"), so only the url or the title moving can show. The
  # ETags above are exactly what catches that, so a deliberate
  # `--signal stored-inventory` run against a slice is worth doing occasionally.
  # It is the second tier, not the nightly question.
  #
  # IDENTITY IS THE DEFAULT, AND THAT IS A RISK WORTH NAMING. CBJ exposes no
  # stable item id -- nothing like CBE's Sitecore GUID -- so identity falls back
  # to [document_url, doc_path, title]. If CBJ ever re-issues a circular at a new
  # storage url, that reads as one new document plus one disappearance, the
  # failure MONITORING.md section 2 names. There is no field available to fix it
  # with today; if CBJ starts exposing one, override `identity` here.
  - regulator: "Central Bank of Jordan (CBJ)"
    source_system: "Legislation"
    signal: crawl
    confirm: false

  # EDB (BAHRAIN) - `crawl` IS A MEASURED CONCLUSION HERE TOO.
  #
  # October CMS on Laravel. A law is an HTML PAGE - no PDFs on this site at all.
  # MEASURED 2026-08-19:
  #   ETag / Last-Modified   ABSENT on every response, section and law pages
  #                          alike - `stored-inventory` has no token to read.
  #   conditional GET        If-Modified-Since answered 200 + the full 95,389-byte
  #                          body. No 304 support.
  #   robots.txt / sitemap   both 404 - so `sitemap` cannot work either.
  #   HEAD                   returns NO Content-Length. It conveys nothing here.
  #   a publisher feed       NONE. /search-result has no dates and no ordering.
  #   /all-laws/all-laws     names all 64 in one request, so it catches a law
  #                          ADDED, REMOVED or RENAMED - but it is BYTE-IDENTICAL
  #                          when Article 12 is edited in place, and it carries no
  #                          category so it cannot build doc_path. A companion to
  #                          the crawl, never a replacement.
  #   raw body sha256        STABLE - 3 fetches byte-identical. The OPPOSITE of
  #                          MLCU: no __VIEWSTATE, no nonce; the edb_session
  #                          cookie is a HEADER and cannot move a body hash.
  #   visible text sha256    STABLE across those same 3.
  #
  # So BOTH bases work and text is a CHOICE: raw HTML moves whenever EDB redeploys
  # a template, reporting all 64 laws modified for a footer change. A probe would
  # also buy nothing - with no ETag it must fetch and hash all 64 law pages
  # against the crawl's 72, and it CANNOT DISCOVER A NEW LAW.
  #
  # `confirm: true` is recorded, not exercised; if ever run it must hash text.
  # IDENTITY IS THE DEFAULT: measured across all 64, no duplicate document_url,
  # title or content_hash and no version suffix in any slug.
  - regulator: "Bahrain Economic Development Board (EDB)"
    source_system: "Bahrain Business Laws"
    signal: crawl
    confirm: true

  # MLSD (BAHRAIN) - `crawl`, AND THE MEASUREMENT THAT DECIDED IT IS UNUSUAL.
  #
  # One page, 30 rows, 28 of them Arabic PDFs behind `download.php?...&id=<32
  # hex>`. MEASURED 2026-08-20:
  #   ETag / Last-Modified   ABSENT on the listing AND on all 28 PDFs.
  #   Content-Length         PRESENT on every PDF - the only per-document token
  #                          this host offers, AND STILL NOT USABLE:
  #                          dynamic_crawler/fingerprint.py reads ETag then
  #                          Last-Modified and returns BASIS_NONE otherwise, so a
  #                          sweep would compare "" against "" and report zero
  #                          changes FOREVER - which reads like a quiet regulator.
  #                          Reading it means changing the one shared token
  #                          definition, which is a change to every source in this
  #                          file, so it is recorded here and not done here.
  #   robots.txt / sitemap   both 404.
  #   a publisher feed       NONE. News and infographics say no law moved.
  #   listing body sha256    STABLE - 3 fetches byte-identical (3d9b79a1c0e55c95).
  #   the `id` values        STABLE across fetches AND across a fresh session with
