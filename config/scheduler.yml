  # ----------------------------------------------------------
  # SIMAH AND SAUDI EXCHANGE -- jobs that read a SAVED PAGE.
  #
  # Both hosts block us, and both blocks were caused by automated access from one
  # address: saudiexchange.sa went from crawling cleanly at 18:27 to Akamai 403
  # within two hours on 2026-08-15, and simah.com's note records its Cloudflare
  # block as "triggered by repeated iteration, not volume".
  #
  # THE CRON INTERVAL HERE DOES NOT DECIDE WHEN EITHER SITE IS VISITED. A run reads
  # output/snapshots/<name>.html and touches no network. The saved page's own
  # clock decides when a live visit is allowed: one navigation, no retry, backing
  # off 6h / 24h / 72h / 7d / 14d after a block -- and only if `allow_live: true`
  # in config/sources/<name>.yml, which ships FALSE. So a shorter interval here
  # cannot make either site see more traffic, and a longer one only delays noticing
  # that the saved page has gone stale.
  #
  # `until` in config/change_signals.yml skip_hosts is unchanged: it stops a SWEEP
  # touching either host. That is a different mechanism from these jobs.
  #
  # Sunday 20:00 / 20:30, continuing the stagger (edb 18:00, moic 19:00,
  # pdpa 19:30). Same `_run_exclusive` lock as every monitor job.
  # ----------------------------------------------------------

  # DISABLED UNTIL THE FORM IS RE-APPROVED. Zero traffic and a snapshot exists
  # (captured 2026-08-05), but dynamic_crawler/hints/simah.rules.yml was edited
  # on 2026-08-17 (the Law and its Implementing Regulations became separate
  # entries, `combined`/`strip` rules were added) after its 2026-08-13 approval,
  # so the approval gate refuses it: "APPROVED BUT SINCE EDITED". A job that fails
  # every week teaches people to ignore failures.
  #
  # ALSO REVIEW WHAT A FIRST RUN WOULD DO. Measured 2026-09-21, read-only: the
  # replay yields 2 documents against the 1 stored row (id 172), which would
  # insert 1 new row and version 1 -- the form's rework, not a bug, but it is the
  # thing re-approval exists to look at.
  #
  #     python -m dynamic_crawler.formfill verify dynamic_crawler/hints/simah.rules.yml --snapshot
  #     python -m dynamic_crawler.formfill approve dynamic_crawler/hints/simah.rules.yml --by <name>
  #
  # (`verify --snapshot` was run 2026-09-21: 2 rows on 3/3 runs, 0% spread, 100%
  # fill -- WARN only because a snapshot check cannot approve a form.) Enable this
  # AFTER approve. Once enabled it reads "aging" past 30 days and RAISES past 90
  # (about 2026-11-03) unless refreshed -- that failure is the alert.
  monitor_simah:
    enabled: false
    trigger: cron
    schedule:
      # MONTHLY (day 1), by decision 2026-09-21. The run only READS the saved page;
      # a live visit needs allow_live AND a copy older than max_age_days (25 in
      # its source config, so a monthly run always finds it due). Trade-off: if a
      # visit is blocked, the retry waits for next month's run rather than the
      # backoff clock (6h/24h/72h/7d/14d) -- slower to recover, never more traffic.
      day: 1
      hour: 20
      minute: 0

  # DISABLED UNTIL A SNAPSHOT EXISTS. output/snapshots/ is not part of the code, so
  # a new machine has none, and until one is captured by hand every run raises
  # "has no snapshot". A job that fails every week teaches people to ignore
  # failures. Steps: config/sources/saudi_exchange.yml. Enable this AFTER the first
  # capture reports `ok`.
  monitor_saudi_exchange:
    enabled: false
    trigger: cron
    schedule:
      # MONTHLY (day 1), by decision 2026-09-21. The run only READS the saved page;
      # a live visit needs allow_live AND a copy older than max_age_days (25 in
      # its source config, so a monthly run always finds it due). Trade-off: if a
      # visit is blocked, the retry waits for next month's run rather than the
      # backoff clock (6h/24h/72h/7d/14d) -- slower to recover, never more traffic.
      day: 1
      hour: 20
      minute: 30

