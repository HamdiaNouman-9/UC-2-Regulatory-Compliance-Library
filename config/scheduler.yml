# ============================================================
# Regulatory Pipeline Scheduler Configuration
# ============================================================
# 
# This file controls when each regulator pipeline runs.
# Supports both direct execution and API-based triggering.
#
# Timezone: Set in .env file (default: Asia/Karachi)
# ============================================================

jobs:
  # --------------------------------------------------------
  # SBP Pipeline
  # --------------------------------------------------------
  sbp_pipeline:
    enabled: true
    trigger: cron
    schedule:
      # Run every day at 2:00 AM (Karachi time)
      hour: 2
      minute: 0
      # day_of_week: '*'  # Every day (default)
      # day_of_week: 'mon,wed,fri'  # Specific days
      # day_of_week: 'mon-fri'  # Weekdays only

  # --------------------------------------------------------
  # SECP Pipeline
  # --------------------------------------------------------
  secp_pipeline:
    enabled: true
    trigger: cron
    schedule:
      # Run every day at 3:00 AM (Karachi time)
      hour: 3
      minute: 0

  # --------------------------------------------------------
  # SAMA Pipeline
  # --------------------------------------------------------
  sama_pipeline:
    enabled: true
    trigger: cron
    schedule:
      # Run every day at 4:00 AM (Karachi time)
      hour: 10
      minute: 46

  # --------------------------------------------------------
  # CBB Monitoring — RETIRED 2026-08-20, superseded by monitor_cbb
  # --------------------------------------------------------
  # This ran crawler/cbb_monitoring_crawler.py straight into MSSQL: no workbook
  # step, no human review, no completeness gate. It was the only monitoring job
  # in the repo left `enabled: true`.
  #
  # MEASURED 2026-08-20, the day it was turned off:
  #     regulations WHERE regulator LIKE '%Bahrain%'   ->  0 rows
  #     source_system LIKE 'CBB%'                      ->  0 rows
  #     run_history for CBB                            ->  0 rows
  #
  # A daily job, enabled, that has never produced a row — and nothing about its
  # output said so. That is the same failure shape as a change signal that never
  # fires: indistinguishable from a regulator with nothing to report.
  #
  # CBB now goes through config/sources/cbb.yml like every other regulator, so it
  # gets the workbook gate and a per-source completeness gate. See monitor_cbb in
  # jobs/monitor_jobs.py.
  #
  # DO NOT re-enable this to "have something running". Turning monitor_cbb on is
  # the supported path, and it needs the EXECUTION_MODE question settled first —
  # every monitor job lives in DIRECT_JOB_MAPPING while the scheduler defaults to
  # API_JOB_MAPPING, where none of them exist.
  cbb_monitoring:
    enabled: false
    trigger: cron
    schedule:
      hour: 5
      minute: 0

  # --------------------------------------------------------
  # Full Pipeline (All Regulators)
  # --------------------------------------------------------
  # This is only available when using API mode
  # It triggers all regulators via a single API call
  full_pipeline:
    enabled: false  # Set to true if you want to use this instead
    trigger: cron
    schedule:
      # Run every day at 2:00 AM (Karachi time)
      hour: 2
      minute: 0

# ============================================================
# Schedule Examples
# ============================================================
#
# Daily at specific time:
#   hour: 14
#   minute: 30
#
# Weekdays only at 9 AM:
#   hour: 9
#   minute: 0
#   day_of_week: 'mon-fri'
#
# Specific days at 6 PM:
#   hour: 18
#   minute: 0
#   day_of_week: 'mon,wed,fri'
#
# Every 6 hours:
#   trigger: interval
#   schedule:
#     hours: 6
#
# Every Monday at 10 AM:
#   hour: 10
#   minute: 0
#   day_of_week: 'mon'
#
# Twice daily (8 AM and 8 PM):
#   Create two separate jobs with different hours
# ============================================================

  # ==========================================================
  # KSA MONITORING
  # ==========================================================
  # Grouped by what each regulator's site will actually answer, because that —
  # not the regulator's importance — decides how often and how expensively it
  # can be checked. The measurements behind each grouping are in
  # jobs/monitor_jobs.py and config/change_signals.yml.
  #
  # All four write STRAIGHT TO MSSQL and leave `status` EMPTY. "What arrived
  # overnight and nobody has judged" is `WHERE status = ''`; a person sets
  # active/reject through POST /update-status/regulations. Nothing here approves
  # its own output.
  #
  # DISABLED BY DEFAULT. Turning these on is a server decision, not a repo one.
  # ----------------------------------------------------------

  # MOE, MOH, SDAIA, AML, MHRSD, ZATCA — one request per stored document,
  # about a minute for all six. Crawls only what actually moved.
  monitor_cheap_probes:
    enabled: false
    trigger: cron
    schedule:
      hour: 3
      minute: 0

  # SAMA's own "what changed" page: ~3 seconds instead of 6,101 probes. This is
  # also the only signal that DISCOVERS documents missing from the library.
  monitor_sama:
    enabled: false
    trigger: cron
    schedule:
      hour: 3
      minute: 15

  # mc.gov.sa refuses plain HTTP clients, so no probe can answer and the crawl
  # IS the signal. ~16 minutes, so weekly rather than daily.
  monitor_mc:
    enabled: false
    trigger: cron
    schedule:
      day_of_week: 'sun'
      hour: 4
      minute: 0

  # CMA cannot be probed (its Last-Modified is the current time) and cannot be
  # confirmed at scale. Weekly, and the announcements tab MUST run as a recent
  # window — a full walk measured 2h49m and still returned 300 of the 1,053
  # announcements we hold, which would rule the other 753 `disappeared`.
  # CMA_SINCE_DAYS controls that window.
  monitor_cma:
    enabled: false
    trigger: cron
    schedule:
      day_of_week: 'sun'
      hour: 5
      minute: 0

  # MLCU (Egypt). No ETag, no Last-Modified, no sitemap lastmod, and its news
  # page carries neither dates nor document links — every cheaper signal was
  # measured and ruled out, so the crawl is the signal. Small: five section
  # pages plus 24 PDFs.
  #
  # DISABLED, AND FOR A SECOND REASON BEYOND THE ONE ABOVE. The other four are
  # off because turning them on is a server decision. This one is off because
  # MLCU IS NEW AND NOBODY HAS READ ITS WORKBOOK YET. A new regulator goes to a
  # workbook first; this path writes straight to MSSQL, so enabling it before
  # the review would make the first scheduled run be the ingest. Turn it on
  # after the workbook is approved and promoted, not before.
  #
  # Sunday 06:00 keeps it clear of monitor_mc (04:00) and monitor_cma (05:00) —
  # all three take the same `_run_exclusive` lock, and an overlap is a SKIP, so
  # a colliding slot would silently starve a job rather than fail.
  monitor_mlcu:
    enabled: false
    trigger: cron
    schedule:
      day_of_week: 'sun'
      hour: 6
      minute: 0

 # CBE, same rule as MLCU: workbook first, schedule second.
  #
  # Sunday 07:00 — one hour after monitor_mlcu. All monitor jobs take the same
  # `_run_exclusive` lock and an overlap is a SKIP, not a failure, so a
  # colliding slot silently starves a job instead of erroring. CBE is the
  # longest of them (twelve sources; the workbook export ran ~40 min), so give
  # it the last slot of the morning.
  monitor_cbe:
    enabled: false
    trigger: cron
    schedule:
      day_of_week: 'sun'
      hour: 7
      minute: 0

  # BAHRAIN BOURSE (BHB), same rule as MLCU and CBE: workbook first, schedule
  # second. The Legal Framework accordion is entirely client-rendered, but the
  # page's own JS calls one API (GetFaq) that returns all seven sections in a
  # single ~20 KB request — cheap, and the crawl already IS the signal. See
  # crawler/bahrain_bourse_crawler.py and docs/HANDOFF_bahrain_bourse.md.
  #
  # Bahrain Bourse is an EXCHANGE, and the last exchange this project crawled
  # (saudiexchange.sa) was permanently blocked within two hours of ordinary
  # automated access. Read docs/HANDOFF_bahrain_bourse.md §0 before turning
  # this on or re-measuring the site by hand.
  #
  # Sunday 08:00 — one hour after monitor_cbe. All monitor jobs take the same
  # `_run_exclusive` lock and an overlap is a SKIP, not a failure, so a
  # colliding slot silently starves a job instead of erroring. This was the
  # only free hour on the Sunday morning schedule as of 2026-08-20.
  monitor_bahrain_bourse:
    enabled: false
    trigger: cron
    schedule:
      day_of_week: 'sun'
      hour: 8
      minute: 0

  # CBB on the config flow — REPLACES the retired `cbb_monitoring` above.
  #
  # Sunday 09:00, the last free slot of the morning. Every monitor job takes the
  # same `_run_exclusive` lock and an overlap is a SKIP, not a failure, so a
  # colliding slot silently starves a job rather than erroring. Taken: mc 04:00,
  # cma 05:00, mlcu 06:00, cbe 07:00, bahrain_bourse 08:00.
  #
  # CBB is the heaviest of them — mode 2c walks the whole rulebook sidebar and
  # mode 4 measured 1,095 documents — so it gets the end of the queue where a
  # long run cannot starve anything behind it.
  #
  # STAYS OFF until (a) a person has read a CBB workbook, and (b) the
  # EXECUTION_MODE / two-job-mapping question is settled. Enabling it today logs
  # "No function mapped for job: monitor_cbb" and does nothing.
  monitor_cbb:
    enabled: false
    trigger: cron
    schedule:
      day_of_week: 'sun'
      hour: 9
      minute: 0

  # ---- Bahrain, onboarded by abeeraslam, merged 2026-08-26 ----------------
  # Sunday 10:00 / 11:00 / 12:00, continuing the one-hour stagger. Every
  # monitor_* job takes the same `_run_exclusive` lock and an overlap is a SKIP,
  # not a failure -- a colliding slot silently starves a job rather than
  # erroring. Taken before these: mc 04:00, cma 05:00, mlcu 06:00, cbe 07:00,
  # bahrain_bourse 08:00, cbb 09:00.
  #
  # LLOC is the cheap one -- monitor_lloc narrows to the "Latest Legislation"
  # window, 144 records in ~40 seconds, rather than the 2,838-second
  # classification walk. It could run daily once reviewed; weekly here so the
  # first scheduled runs stay beside the others.
  #
  # ALL THREE DISABLED. Nobody has read their workbooks, and this path writes
  # straight to MSSQL.
  monitor_rera:
    enabled: false
    trigger: cron
    schedule:
      day_of_week: 'sun'
      hour: 10
      minute: 0

  monitor_sio:
    enabled: false
    trigger: cron
    schedule:
      day_of_week: 'sun'
      hour: 11
      minute: 0

  monitor_lloc:
    enabled: false
    trigger: cron
    schedule:
      day_of_week: 'sun'
      hour: 12
      minute: 0

  # ----------------------------------------------------------
  # NO JOB FOR Saudi Exchange OR SIMAH — deliberately.
  #
  # Both hosts block us, and both blocks were caused by automated access from
  # this one address: saudiexchange.sa went from crawling cleanly at 18:27 to
  # Akamai 403 within two hours on 2026-08-15, and simah.com's note records its
  # Cloudflare block as "triggered by repeated iteration, not volume".
  #
  # A scheduled retry is therefore not a way out of either block — it is the
  # thing that made them, and it would deepen them. config/change_signals.yml
  # `skip_hosts` already stops a sweep touching the hosts; giving them no job
  # means nothing can schedule its way past that either.
  #
  # The `until` dates there are REVIEW dates, not expiries: a person retests by
  # hand and deletes the entry. Nothing unblocks itself.
  # ----------------------------------------------------------

  # ---- Qatar, onboarded 2026-09-17 ---------------------------------------- #
  # Sunday 13:00, continuing the one-hour stagger. Every monitor_* job takes the
  # same `_run_exclusive` lock and an overlap is a SKIP, not a failure, so a
  # colliding slot silently starves a job rather than erroring. Taken before
  # this: mc 04:00, cma 05:00, mlcu 06:00, cbe 07:00, bahrain_bourse 08:00,
  # cbb 09:00, rera 10:00, sio 11:00, lloc 12:00.
  #
  # WEEKLY, not daily, although the crawl is cheap enough to run daily — roughly
  # twenty requests, the Legislation half measured at 6 requests in 1.8 seconds.
  # Legislation does not move daily, and a weekly slot keeps it beside the
  # others under one lock.
  #
  # DISABLED. Two things are still outstanding: ONBOARDING Step 7 (the second
  # export, compared row by row) has not been run, and nobody has promoted the
  # workbook. This path writes straight to MSSQL, so enabling it now would make
  # the first scheduled run the ingest — the thing the workbook step exists to
  # prevent.
  monitor_qcb:
    enabled: false
    trigger: cron
    schedule:
      day_of_week: 'sun'
      hour: 13
      minute: 0

  # QFCL — THE REGULATOR'S OWN REVISION FEED, not a crawl and not a probe.
  #
  # Four requests a run, one per source_system in qfcl.yml, against
  # qfcra-en.thomsonreuters.com/view-revision-updates. The alternative is a
  # stored-inventory sweep of 8,034 documents. MEASURED 2026-09-18: a 60-day
  # window returned ONE entry, so the expensive sweep would spend 8,034 requests
  # to learn that nothing happened.
  #
  # DAILY IS AFFORDABLE HERE AND WEEKLY IS NOT ENOUGH. Unlike monitor_qcb below,
  # which crawls, this costs four requests — so it can run at the cadence the
  # feed is useful at. 04:00 keeps it clear of monitor_sama at 03:15, which hits
  # the same Thomson Reuters platform on a different host.
  #
  # DISABLED, for the same reason as every other Qatar job and one more:
  #   1. Nobody has promoted qfcl.xlsx. The sweep reads the stored inventory
  #      with --with-db, so until then every feed entry reports as a document
  #      the library does not hold — 8,034 phantom discoveries on the first run.
  #   2. ONBOARDING's second sweep has not been run. The checklist calls it one
  #      of the two steps people skip, because run 1 looks identical whether the
  #      signal is right or wrong.
  # Enable it after the promote, and only once a second sweep reports zero
  # changes.
  monitor_qfcl:
    enabled: false
    trigger: cron
    schedule:
      hour: 4
      minute: 0
