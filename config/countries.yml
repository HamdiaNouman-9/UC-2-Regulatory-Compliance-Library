# Which country each regulator belongs to, for the FOLDER TREE ONLY.
#
# ---------------------------------------------------------------------------
# THIS DOES NOT GO INTO doc_path, AND MUST NOT
# ---------------------------------------------------------------------------
# `doc_path` is one of the three identity fields:
#
#     DEFAULT_IDENTITY = ("document_url", "doc_path", "title")
#
# so putting the country in it would change the identity of EVERY stored
# document at once. The next crawl would read all 9,358 as `new` and all the
# stored rows as `disappeared` — and `disappeared` feeds the withdrawal gate.
# That is the exact failure dynamic_crawler/MONITORING.md §2 exists to prevent,
# applied to the whole library in one run.
#
# So the country is prepended when BUILDING THE TREE and nowhere else.
# `regulations.doc_path` keeps starting at the regulator, identity is untouched,
# and no document is reclassified. The tree gains a level; the library does not
# move.
#
# ---------------------------------------------------------------------------
# WHY A FILE AND NOT A FIELD ON EACH SOURCE CONFIG
# ---------------------------------------------------------------------------
# Not every regulator has a config/sources/*.yml — the formfill forms carry
# their regulator under `library.regulator` in dynamic_crawler/hints/*.yml, and
# SAMA/SBP/SECP predate both. One list keyed on the regulator NAME covers all of
# them, and there is exactly one place to look when a folder lands in the wrong
# country.
#
# THE NAME MUST MATCH EXACTLY, including the "(ACRONYM)" suffix, because that is
# what `regulations.regulator` and `doc_path[0]` hold. A near-miss does not
# error — it silently leaves the regulator at the root, which is why
# `scripts/verify_country_tree.py` asserts that the root count is exactly the
# number of countries below.

countries:
  "Kingdom of Saudi Arabia":
    - "Saudi Arabian Monetary Authority (SAMA)"
    - "Capital Market Authority (CMA)"
    - "Ministry of Commerce"
    - "Ministry of Education"
    - "Ministry of Health"
    - "Ministry of Human Resource and Social Development (MHRSD)"
    - "Ministry of Investment (MISA)"
    - "Saudi Data and AI Authority (SDAIA)"
    - "Saudi Credit Bureau (SIMAH)"
    - "Saudi Exchange"
    - "Anti-Money Laundering Permanent Committee (AML)"
    - "Zakat, Tax and Customs Authority (ZATCA)"
    # Onboarded 2026-09-24 with config/sources/nca.yml.
    - "National Cybersecurity Authority (NCA)"

  # Onboarded 2026-09-08 with config/sources/cbj.yml. Listed at onboarding
  # rather than at first crawl for the reason the Bahrain block below records:
  # an unlisted regulator keeps its folders at the TREE ROOT, and every document
  # is still correct, so nothing else complains.
  "Jordan":
    - "Central Bank of Jordan (CBJ)"

  "Egypt":
    - "Central Bank of Egypt (CBE)"
    - "Egyptian Anti-Money Laundering and Counter-Terrorism Financing Unit (MLCU)"

  # Onboarded 2026-09-07. A `mode: declared` single-instrument source.
  # Listed here at onboarding rather than at first crawl for the reason the
  # Bahrain block below records: an unlisted regulator keeps its folders at the
  # TREE ROOT, and the documents are all correct, so nothing else complains.
  # NAME IS THE ONBOARDING SHEET'S, column "Regulator / Framework", verbatim.
  # It names an instrument rather than an authority, so it does not carry the
  # "Full Name (ACRONYM)" shape the rest of this file uses. That is deliberate:
  # this string is identity, it must match config/sources/kdipa.yml exactly, and
  # a near miss falls back to defaults silently rather than erroring.
  "Kuwait":
    - "REGULATION GOVERNING COLLECTIVE INVESTMENT SCHEME JUNE 2013"

  "Bahrain":
    - "Central Bank of Bahrain"
    - "Bahrain Bourse (BHB)"
    # Onboarded by abeeraslam, merged 2026-08-26. Listed here at merge time
    # rather than at first crawl: an unlisted regulator keeps its folders at the
    # TREE ROOT, and that is the failure that is expensive to notice -- the
    # documents are all correct, so nothing else complains.
    - "Real Estate Regulatory Authority (RERA)"
    - "Social Insurance Organisation (SIO)"
    - "Legislation and Legal Opinion Commission (LLOC)"
    # NBR onboarded 2026-08-31. Listed at onboarding rather than at promote:
    # an unlisted regulator keeps its folders at the TREE ROOT, and nothing
    # else complains because every document is otherwise correct.
    - "National Bureau for Revenue (NBR)"

  # Canada's first entry, onboarded 2026-09-09.
  #
  # ONE REGULATOR, NOT ONE PER ACT. The client list names each Act separately
  # (Bankruptcy and Insolvency, Canadian Payments, Auditor General, Income Tax,
  # ...) but all nine of its federal Acts are published by ONE publisher, the
  # Justice Laws Website. They are one crawler and one regulator, with each Act
  # its own source entry and its own folder in config/sources/justice_canada.yml.
  "Canada":
    - "Department of Justice Canada (JUS)"


  "Qatar":
    # Onboarded 2026-09-17 (branch feature/qatar-regulators). Listed here in the
    # SAME change that adds config/sources/qfcl.yml, not at first crawl: an
    # unlisted regulator keeps its folders at the TREE ROOT, every document
    # stays correct, and nothing else complains -- the failure shape the Bahrain
    # note above records.
    #
    # The scope sheet names the framework, not an authority, so that is what the
    # regulator is called. Spelled identically in config/sources/qfcl.yml and in
    # crawler/qfcl_source.py::REGULATOR; country_for() matches the exact string.
    - "Qatar Financial Centre Legislation"
    # Spelled identically in config/sources/qcb.yml and in
    # crawler/qcb_source.py::REGULATOR. The site calls itself "Qatar Central
    # Bank" (not "Central Bank of Qatar"); the "(QCB)" suffix is ONBOARDING
    # Step 3's naming rule, "Full Name (ACRONYM)", and this whole string is
    # what doc_path[0] holds.
    - "Qatar Central Bank (QCB)"

  # The United States' first entry, onboarded 2026-09-28 (branch
  # feature/usa-regulators). Listed here in the SAME change that settles
  # its first source config, not at first crawl, for the reason the
  # Bahrain and Qatar blocks above record: an unlisted regulator keeps its
  # folders at the TREE ROOT, every document is still correct, and nothing else
  # complains -- so the mistake survives for months.
  #
  # NAME: "United States of America", the ISO 3166 short name, so that its
  # alpha-3 in utils/countries.py::_COUNTRY_CODES is the obvious "USA" and
  # resolve_country("USA") — the API's ?country= filter — lands here. Added to
  # that dict in this same change, as its comment requires.
  #
  # FEMA was listed as "Flood Insurance" on 2026-09-28 and renamed to the
  # regulatory body on 2026-09-29, in step with config/sources/fema.yml, which
  # carries the string twice (top level and its declared source). All three must
  # move together: country_for() matches exactly, so editing one alone does not
  # error — it drops the regulator to the tree root, which is what happened to
  # QFCL the day before.
  # FFIEC added 2026-09-29. config/sources/ffiec.yml has asked for this since it
  # was onboarded — "add it under the United States, matching the `regulator`
  # string above EXACTLY ... the entry should land with whatever else the US
  # onboarding brings" — and `check` has been warning on every ffiec.xlsx export
  # that its folders sit at the tree root. This is that branch.
  "United States of America":
    - "Federal Emergency Management Agency (FEMA)"
    - "Federal Financial Institutions Examination Council (FFIEC)"
    - "Financial Crimes Enforcement Network (FINCEN)"
    - "Federal Deposit Insurance Corporation (FDIC)"
    - "Dodd-Frank Wall Street Reform and Consumer Protection Act"
    - "Department of Financial Protection and Innovation (DFPI)"
