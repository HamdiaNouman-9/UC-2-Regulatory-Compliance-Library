# Per-host pacing for the generic crawler (dynamic_crawler/formfill/runner.py),
# read through dynamic_crawler/formfill/access.py since CHG-009 (2026-11-10).
# Before that nothing read this file.
#
# The pause before every navigation is drawn at random from base_ms, then
# multiplied by the host's level. A host is matched on itself or any parent
# domain (www.cma.gov.sa matches cma.gov.sa). A `pace:` key in a hints file
# names a level and overrides the host table for that one form.
#
# throttle_only: hosts that rate-limit bursts but have never banned the
# address. They are paced like everyone else and a 429 is waited out, but a
# refusal there is not counted as a block.
base_ms: [1500, 3500]
default: normal
levels:
  normal: 1
  careful: 3
  very_careful: 5

hosts:
  #Already blocked us once
  nca.gov.sa: very_careful
  saudiexchange.sa: very_careful
  simah.com: very_careful
  #Bot protection or throttles bursts
  cma.gov.sa: careful
  bahrainbourse.com: careful
  nbr.gov.bh: careful
  lloc.gov.bh: careful
  cbe.org.eg: careful

throttle_only:
 - nbr.gov.bh
 - lloc.gov.bh
